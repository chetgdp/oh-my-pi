<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Splash H: WebGL ripple</title>
<style>
@property --t { syntax: "<number>"; inherits: true; initial-value: 0; }
/* --t: dolly progress 0..1. WebGL: JS maps it to a camera distance and drives the .app styles inline.
 * --z: equivalent 2D scale, only used by the no-WebGL fallback below. */
/* Gate opening in icon units: x 26..32, y 24..46, centre (29,35). Icon drawn at 96px: 1 unit = 1.5px.
 * Right leg ends at y 56, 31.5px below the opening centre; that is the waterline. */
:root { --k: 1; --bg: oklch(0.155 0 0); --raised: oklch(0.19 0 0); --fg: oklch(0.93 0 0); --mut: oklch(0.62 0 0); --gate: #c8442e; --line: calc(50vh + 31.5px); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 15px/1.4 system-ui, sans-serif; color: var(--fg); }
body { --t: 0; --z: calc(1 / max(.003, 1 - var(--t) * 1.1)); }
.run { animation: dolly calc(1300ms * var(--k)) cubic-bezier(.4, 0, .7, 1) calc(500ms * var(--k)) both; }
@keyframes dolly { to { --t: 1; } }
.scene {
	position: fixed; inset: 0;
	background:
		linear-gradient(to bottom, #eceded 0%, #dcdedf calc(var(--line) - 2px), #c3c9cb var(--line), #9aa6a9 calc(var(--line) + 6vh), #5d6f73 85%, #3c4b4f 100%);
	/* Scene moves far less than the gate: depth. */
	transform-origin: 50vw 50vh; transform: scale(calc(1 + (var(--z) - 1) * .002));
}
.reflect {
	position: absolute; width: 96px; height: 96px;
	left: calc(50vw - 43.5px); top: calc(var(--line) - 84px);
	transform-origin: 50% 87.5%; transform: scaleY(-1);
	opacity: .55; filter: url(#ripple) blur(.4px);
	-webkit-mask: linear-gradient(to top, #000 55%, transparent 88%); mask: linear-gradient(to top, #000 55%, transparent 88%);
}
.app {
	position: fixed; inset: 0; z-index: 1; background: var(--bg); padding: 20px; box-sizing: border-box;
	clip-path: inset(max(0px, 50vh - 16.5px * var(--z)) max(0px, 50vw - 4.5px * var(--z)));
	/* The opening spans the screen width near z 43; the app arrives only once we are through the gate. */
	opacity: clamp(0, (var(--z) - 42) / 10, 1);
	/* Arrives under the flash peak (z 47): opaque by z 52, blur/scale gone by z 100 (~150ms at normal speed). */
	transform: scale(calc(1 + clamp(0, (100 - var(--z)) / 53, 1) * .04));
	filter: blur(calc(clamp(0, (100 - var(--z)) / 53, 1) * 4px));
}
.gate {
	position: fixed; z-index: 2; width: 96px; height: 96px; pointer-events: none;
	left: calc(50vw - 43.5px); top: calc(50vh - 52.5px);
	transform-origin: 43.5px 52.5px; transform: scale(var(--z));
}
/* Flash veil: the app fades in under an opaque #f4f2ee veil (matching the canvas flash), which then lifts,
 * so the reveal goes white -> crisp app and never shows a translucent dark app over the light flash. */
.app::after {
	content: ""; position: fixed; inset: 0; pointer-events: none; background: #f4f2ee;
	opacity: var(--v, clamp(0, (62 - var(--z)) / 10, 1));
}
.open .app::after { display: none; }
.open .app { clip-path: none; opacity: 1; transform: none; filter: none; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; }
.gl #gl { display: block; }
.gl .scene, .gl .gate { display: none; }
.open .gate, .open .scene, .open #gl { display: none; }
@media (prefers-reduced-motion: reduce) {
	.run { animation: none; }
	.run .gate, .run .scene, .run #gl { display: none; }
	.run .app { clip-path: none; opacity: 1; transform: none; filter: none; }
	.run .app::after { display: none; }
}
h1 { font-size: 26px; margin: 8px 0 18px; }
h2 { font-size: 12px; letter-spacing: .08em; color: var(--mut); margin: 18px 0 8px; font-weight: 500; }
.group { background: var(--raised); border-radius: 14px; overflow: hidden; }
.row { padding: 12px 14px; border-bottom: 1px solid var(--bg); display: flex; justify-content: space-between; }
.row:last-child { border: 0; }
.row span { color: var(--mut); font-size: 13px; }
.controls { position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 9; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
button { padding: 10px 16px; border: 0; border-radius: 12px; background: #222; color: #eee; font: inherit; }
button[aria-pressed="true"] { background: #c8442e; }
body.paused { animation-play-state: paused; }
.tod { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 12px; background: #222; color: #eee; font-size: 13px; }
.tod input { width: 84px; }
.tod output { min-width: 38px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
	<filter id="ripple" x="-20%" y="-20%" width="140%" height="140%">
		<feTurbulence type="fractalNoise" baseFrequency="0.02 0.35" numOctaves="2" seed="3" />
		<feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G" />
	</filter>
	<linearGradient id="rockg" x1="0" y1="46" x2="0" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6b6f6c" /><stop offset=".12" stop-color="#5f665d" /><stop offset="1" stop-color="#2f3433" /></linearGradient>
</svg>
<div class="scene">
	<svg class="reflect" viewBox="0 0 64 64"><path fill="url(#rockg)" d="M8 56L10 53L12 52.4L14 49.5L16 48.5L17.5 45.8H26.5L28 49L29.5 51L31 56zM1 56L2.5 53.6L5 53L6 49.5L7.2 48.8L8.4 52L11 52.5L13.5 54L14 56zM27 56L28.5 54L30 53.6L31.4 54.2L32.6 53.2L34 56zM42 56L43.5 53.4L45.2 52.4L47 53L48.5 52.6L50 56z" /><path fill="var(--gate)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z" /></svg>
</div>
<canvas id="gl"></canvas>
<div class="app">
	<h1>Sessions</h1>
	<h2>MAC-STUDIO</h2>
	<div class="group">
		<div class="row">Refactor session store <span>2m</span></div>
		<div class="row">Splash research <span>14m</span></div>
		<div class="row">Fix rpc reconnect <span>1h</span></div>
	</div>
	<h2>BUILD-BOX</h2>
	<div class="group">
		<div class="row">Native rebuild <span>3h</span></div>
		<div class="row">Fingerprint test <span>1d</span></div>
	</div>
</div>
<svg class="gate" viewBox="0 0 64 64"><path fill="url(#rockg)" d="M8 56L10 53L12 52.4L14 49.5L16 48.5L17.5 45.8H26.5L28 49L29.5 51L31 56zM1 56L2.5 53.6L5 53L6 49.5L7.2 48.8L8.4 52L11 52.5L13.5 54L14 56zM27 56L28.5 54L30 53.6L31.4 54.2L32.6 53.2L34 56zM42 56L43.5 53.4L45.2 52.4L47 53L48.5 52.6L50 56z" /><path fill="var(--gate)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z" /></svg>
<div class="controls">
	<button id="play">Play</button>
	<button id="pause" aria-pressed="false">Pause</button>
	<button id="loop" aria-pressed="false">Loop</button>
	<button id="reset">Start frame</button>
	<label class="tod"><input id="hour" type="range" min="0" max="24" step="0.25" /><output id="hourv"></output></label>
</div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.style.setProperty("--k", q.has("slow") ? 5 : 1);
const loopBtn = document.getElementById("loop");
let looping = false;
let timer = 0;
const app = document.querySelector(".app");
function reset() {
	clearTimeout(timer);
	app.style.cssText = "";
	document.body.className = "";
	document.getElementById("pause").setAttribute("aria-pressed", "false");
	if (window.glStart) glStart();
}
function play() {
	reset();
	void document.body.offsetWidth;
	if (window.glWarm) glWarm();
	document.body.className = "run";
}
document.body.addEventListener("animationend", () => {
	app.style.cssText = "";
	document.body.classList.add("open");
	if (looping) timer = setTimeout(play, 1000);
});
document.getElementById("play").onclick = play;
document.getElementById("reset").onclick = () => { looping = false; loopBtn.setAttribute("aria-pressed", "false"); reset(); };
const pauseBtn = document.getElementById("pause");
pauseBtn.onclick = () => pauseBtn.setAttribute("aria-pressed", String(document.body.classList.toggle("paused")));
loopBtn.onclick = () => {
	looping = !looping;
	loopBtn.setAttribute("aria-pressed", String(looping));
	if (looping) play();
};

const FS = `precision highp float;
uniform vec2 R; uniform float T, L, D, F, CZ, EH; uniform vec3 P;
// time-of-day sky: zenith/horizon colour, sun colour (x intensity), key light dir/colour, portal tint
uniform vec3 ZC, HC, SC, KD, KC, PT;
uniform vec4 SP, MP; // sun px xy, sun vis, twilight warmth; moon px xy, moon light, stars
const vec3 LAC = vec3(.82,.27,.15);
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
	return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
float h1(float i){ return fract(sin(i * 127.1) * 43758.5453); }
float lnz(float x){ float i = floor(x); return mix(h1(i), h1(i + 1.), fract(x)); }
vec3 sky(vec2 p, float sun){
	float hgt = max(L - p.y, 0.), ys = clamp(hgt / L, 0., 1.);
	vec3 c = mix(HC, ZC, pow(ys, .55));
	vec2 ds = (p - SP.xy) / R.y, dm = (p - MP.xy) / R.y;
	float sd = length(ds), md = length(dm);
	// dawn/dusk band: warm near the sun azimuth, along the horizon
	c += SC * SP.w * exp(-ys * 5.) * exp(-abs(ds.x) * 2.2) * .55;
	// sun: disc, glow, Mie halo
	c += SC * SP.z * sun * (smoothstep(.016, .012, sd) * 1.2 + exp(-sd * 14.) * .45 + exp(-sd * 3.) * .16);
	// stars
	if (MP.w > 0.) {
		vec2 cl = floor(p / 5.), sp = cl * 5. + 1. + 3. * vec2(h21(cl + 7.), h21(cl + 3.));
		float hs = h21(cl);
		float st = step(.985, hs) * smoothstep(1.2, .2, length(p - sp)) * (.6 + .4 * sin(T * (2. + hs * 3.) + hs * 90.));
		c += vec3(.9,.93,1.) * st * MP.w * smoothstep(.02, .25, ys);
	}
	// moon
	c += vec3(.93,.95,1.) * MP.z * 3. * sun * (smoothstep(.012, .009, md) * 1.6 + exp(-md * 30.) * .45 + exp(-md * 6.) * .22);
	float hz = exp(-hgt / 220.);
	c = mix(c, HC, hz * .35);
	return c;
}
vec2 waves(vec2 w, float t){
	vec2 n = vec2(0.);
	vec4 A = vec4(.9,.6,.4,.25), K = vec4(.6,1.1,1.9,3.3), S = vec4(.7,1.0,1.4,1.9);
	vec2 d0 = normalize(vec2(1.,.35)), d1 = normalize(vec2(-.7,1.)), d2 = normalize(vec2(.3,-1.)), d3 = normalize(vec2(-1.,-.2)), d4 = normalize(vec2(.9,-.6));
	n += d0 * A.x*K.x*cos(dot(w,d0)*K.x + t*S.x);
	n += d1 * A.y*K.y*cos(dot(w,d1)*K.y + t*S.y);
	n += d2 * A.z*K.z*cos(dot(w,d2)*K.z + t*S.z);
	n += d3 * A.w*K.w*cos(dot(w,d3)*K.w + t*S.w);
	n += d4 * .12*5.1*cos(dot(w,d4)*5.1 + t*2.4);
	return n;
}
vec3 light(vec3 n, vec3 alb, float gl){
	float df = max(dot(n, KD), 0.);
	float sp = pow(max(dot(n, normalize(KD + vec3(0,0,1))), 0.), 36.) * gl;
	float am = .62 + .25 * (-n.y);
	vec3 amb = mix(HC, ZC, .5) * .9;
	// grazing rim tinted by the albedo: an untinted rim lit every face whose normal is perpendicular to the view (grey undersides)
	return alb * (amb * am + KC * df + KC * pow(1. - abs(n.z), 3.) * .5) + (KC * 1.4 + amb * .2) * sp;
}
// World: metres, y up, z away from the camera, water at y 0, gate plane z 0, opening centred on x 0.
// Gate = logo path at .4 m per icon unit (icon x 29 -> x 0, icon y 56 -> y 0).
vec3 N; float M, G, AA, TA, T0, FP, HIT;
float sdB(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.) - r; }
float smin(float a, float b, float k){ float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
// tapered round post: inner face stays at |x| 1.2 (the opening), outer face tapers 1.42 -> 1.2 m radius
float post(vec3 p, float s, float y0){
	float r = mix(1.42, 1.2, clamp(p.y / 12.9, 0., 1.));
	float dr = (length(vec2(p.x - s * (1.2 + r), p.z)) - r) * .97, dy = abs(p.y - (y0 + 13.4) * .5) - (13.4 - y0) * .5;
	return length(max(vec2(dr, dy), 0.)) + min(max(dr, dy), 0.);
}
// pi: two posts, lacquered shimaki band 12.8..15.2, black kasagi with a gentle upward sweep to rounded tips
float gd(vec3 p){
	float a = min(post(p, -1., 2.), post(p, 1., -.5));
	float b = sdB(p - vec3(1.2, 14., 0.), vec3(7.2, 1.2, 1.5), .22);
	float x = p.x - 1.2, f = smoothstep(4.5, 7.7, abs(x));
	float c = sdB(vec3(x, p.y - 15.62 - .003 * x * x - .275 * f * f, p.z), vec3(7.7, .42 + .06 * f, 1.9), .2) * .85;
	G = c < min(a, b) ? 3. : a < b - .04 ? 1. : 2.;
	return min(smin(a, b, .3), c);
}
vec3 nrm(vec3 p){
	const vec2 k = vec2(1., -1.) * .015;
	return normalize(k.xyy * gd(p + k.xyy) + k.yyx * gd(p + k.yyx) + k.yxy * gd(p + k.yxy) + k.xxx * gd(p + k.xxx));
}
// raymarch only inside the gate's AABB, <= 48 steps; aa: record closest miss for edge coverage
float gTrace(vec3 ro, vec3 rd, float t, bool aa){
	vec3 iv = 1. / rd, t0 = (vec3(-6.8, -.6, -2.) - ro) * iv, t1 = (vec3(9.2, 16.7, 2.) - ro) * iv, mn = min(t0, t1), mx = max(t0, t1);
	float tn = max(max(mn.x, mn.y), mn.z), tf = min(min(min(mx.x, mx.y), mx.z), t);
	if (tf < max(tn, 0.)) return t;
	float s = max(tn, 0.), pf = 1. / (F * D), mr = 1e9, ms = 0.;
	for (int i = 0; i < 48; i++) {
		vec3 p = ro + rd * s;
		float d = gd(p), e = (s + T0) * pf;
		if (d < e * .1) { M = G; N = nrm(p); return s; }
		if (aa && d < mr * e) { mr = d / e; ms = s; }
		s += d;
		if (s > tf) break;
	}
	if (aa && mr < .5) { AA = .5 - mr; TA = ms; }
	return t;
}
// faceted granite: ellipsoid cut by 9 random planes (exact plane distance in the stretched frame), smooth max rounds the edges
vec3 RC, RR; float RS, AR, RI = -9., RH; vec4 PL[9];
float smax(float a, float b, float k){ return -smin(-a, -b, k); }
float rk(vec3 p){
	p -= RC;
	vec3 q = p / RR; float k0 = length(q), k1 = length(q / RR), m = min(RR.x, min(RR.y, RR.z));
	float d = k0 * (k0 - 1.) / k1;
	for (int i = 0; i < 9; i++) d = smax(d, dot(p, PL[i].xyz) - PL[i].w, .06 * m);
	// left rock: solid shoulder under the post base so the post never floats on a cut
	if (RS < 1.) d = smin(d, max(sdB(p - vec3(.6, 1.3, -.2), vec3(1.5, 1.2, 1.5), .6), dot(p, normalize(vec3(-.3, 1., .2))) - 2.3), .5);
	return d + (vn(p.xz * 2.3 + p.y * 1.7) - .5) * .05 * m;
}
vec3 rnrm(vec3 p){
	const vec2 k = vec2(1., -1.) * .02;
	return normalize(k.xyy * rk(p + k.xyy) + k.yyx * rk(p + k.yyx) + k.yxy * rk(p + k.yxy) + k.xxx * rk(p + k.xxx));
}
vec3 rcen(float i){ return i < .5 ? vec3(-3.2, 0., .2) : i < 1.5 ? vec3(24., 0., 70.) : vec3(27.6, 0., 72.); }
vec3 rrad(float i){ return i < .5 ? vec3(2.5, 4.4, 2.9) : i < 1.5 ? vec3(3.4, 1.9, 2.6) : vec3(1.6, 1., 1.4); }
void setR(float i){ if (i == RI) return; RI = i; RS = i < .5 ? .37 : i < 1.5 ? 11.9 : 23.4; RC = rcen(i); RR = rrad(i);
	// plane i: normal drawn in the unit-sphere frame, mapped to world; offset .66-.94 of the support distance
	for (int k = 0; k < 9; k++) {
		float f = RS + float(k) * 7.13;
		vec3 n = vec3(h1(f) - .5, h1(f + 1.7) * .9 - .2, h1(f + 3.1) - .5) / RR;
		PL[k] = vec4(n, (.66 + .28 * h1(f + 5.3)) * length(n * RR)) / length(n);
	} }
// raymarch inside the rock AABB, <= 40 steps, .8 step scale; closest miss feeds the edge AA like the gate
float rTrace(vec3 ro, vec3 rd, float i, float t, bool aa){
	vec3 c = rcen(i), r = rrad(i) * 1.08, iv = 1. / rd, t0 = (c - r - ro) * iv, t1 = (c + r - ro) * iv;
	t0.y = (-.3 - ro.y) * iv.y;
	vec3 mn = min(t0, t1), mx = max(t0, t1);
	float tn = max(max(mn.x, mn.y), mn.z), tf = min(min(min(mx.x, mx.y), mx.z), t);
	if (tf < max(tn, 0.)) return t;
	setR(i);
	float s = max(tn, 0.), pf = 1. / (F * D), mr = 1e9, ms = 0.;
	for (int j = 0; j < 40; j++) {
		vec3 p = ro + rd * s;
		float d = rk(p), e = (s + T0) * pf;
		if (d < e * .1) { if (p.y < -.05) return t; M = 4.; N = rnrm(p); return s; }
		if (aa && d < mr * e) { mr = d / e; ms = s; }
		s += max(d * .8, e * .05);
		if (s > tf) break;
	}
	if (aa && mr < .5 && .5 - mr > AA && ro.y + rd.y * ms > -.05) { AA = .5 - mr; TA = ms; AR = i; }
	return t;
}
float trace(vec3 ro, vec3 rd, bool aa){
	float t = 1e9; AR = -1.;
	for (int i = 0; i < 3; i++) { float u = rTrace(ro, rd, float(i), t, aa); if (u < t) { t = u; RH = float(i); } }
	float a0 = AA;
	t = gTrace(ro, rd, t, aa);
	if (AA != a0) AR = -1.;
	return t;
}
// set N/M for an edge-AA sample at q
void edgeN(vec3 q){ if (AR < 0.) { N = nrm(q); M = G; } else { RH = AR; setR(AR); N = rnrm(q); M = 4.; } }
vec3 shade(vec3 q){
	vec3 n = N, alb; float g = .3;
	if (M < 3.5) {
		// wood under lacquer: fibres along the member, growth rings warped by noise (TSL "wood" in spirit)
		vec2 gc = M < 1.5 ? vec2(atan(q.z, q.x - sign(q.x) * 2.5) * 1.6, q.y * .3) : vec2(q.z * 2.2 + q.y * 1.6, q.x * .22);
		float fib = vn(vec2(gc.x * 9., gc.y * 2.)), grain = mix(fib, .5 + .5 * sin(gc.x * 11. + gc.y * 3. + vn(gc * vec2(2., 5.)) * 6.), .45);
		// edge distance: beams by box faces, posts only near the top joint
		vec3 s = M < 2.5 ? vec3(7.2, 1.2, 1.5) - abs(q - vec3(1.2, 14., 0.)) : vec3(7.7, .42, 1.9) - abs(q - vec3(1.2, 15.62, 0.));
		float e = M < 1.5 ? 12.9 - q.y : s.x + s.y + s.z - max(s.x, max(s.y, s.z)) - min(s.x, min(s.y, s.z));
		// wear: fine, subtle, faded out once a pixel covers more than a few cm (no blotches at distance)
		float hf = smoothstep(.06, .015, FP);
		float wear = smoothstep(.8, .98, vn(q.xy * vec2(3.6, 1.8) + q.z * 3.) * .7 + vn(q.xy * 14. + q.z) * .3 * hf + (1. - smoothstep(0., .2, e)) * .3) * mix(.25, .6, hf);
		n = normalize(n + (fib - .5) * .035 * (1. - wear));
		// weathering: broad patches drift between sun-bleached orange-pink and deeper red
		float pv = vn(q.xy * vec2(.35, .18) + q.z * .3) * .65 + vn(q.xy * vec2(1.1, .5) + 9.) * .35;
		alb = mix(LAC * vec3(.9, .85, .9), mix(LAC, vec3(.85,.55,.45), .35), pv) * (.9 + .15 * grain);
		// soft occlusion where the posts meet the band (posts near the top, band underside near the posts)
		float jd = M < 1.5 ? 12.8 - q.y : q.y - 12.8 + max(min(abs(q.x + 2.5), abs(q.x - 2.5)) - 1.3, 0.);
		alb *= mix(.8, 1., smoothstep(0., 1.4, jd));
		alb = mix(alb, mix(vec3(.36,.15,.09), vec3(.5,.24,.14), grain), wear * .35);
		g = mix(.22, .06, wear);
		if (M < 1.5) {
			alb *= mix(.9, 1., smoothstep(12.8, 11., q.y));
			float yb = q.x < 0. ? 3.3 : 1.7, bk = smoothstep(yb + .12, yb - .05, q.y + (vn(q.xz * 6.) - .5) * .08);

// aerial perspective: objects sit inside the horizon mist
vec3 haze(vec3 c, vec3 mc, float t){ return mix(c, mc, 1. - exp(-t / 380.)); }
vec3 scene(vec2 p){

vec3 bgd(vec2 p, vec3 ro, vec3 rd, vec3 mc, float tw){

	float d = p.y - L + .6, near = clamp(d / (R.y - L), 0., 1.);
	vec2 n = waves(vec2(W.x * .15, W.z * .4), T) * .25;
	vec3 rr = reflect(rd, normalize(vec3(-n.x * .045, 1., -n.y * .08)));
	rr.y = max(rr.y, 1e-4);
	AA = 0.; T0 = tw;
	float to = trace(W, rr, true), ra = AA, rt = TA;
	T0 = 0.;

void main(){
	vec2 p0 = vec2(gl_FragCoord.x, R.y*D - gl_FragCoord.y) / D;

	if (CZ < 0. && u.x > 26. && u.x < 32. && u.y > 24. && u.y < 56.) {
		// portal membrane
		vec2 q = u - vec2(29., 40.);

		float ei = min(min(u.x - 26.6, 31.4 - u.x), u.y - 26.5);
		float spd = 1.5 + P.y * 9.;

		vec2 hz = vec2(vn(u * 1.8 + vec2(0., T * .9)), vn(u * 1.8 + vec2(5.2, -T * .7))) - .5;

	col = mix(col, vec3(.957,.949,.933), P.z * P.z * .6);
	gl_FragColor = vec4(col, 1.);
}`;

// Time of day: local clock, ?hour= override, or the slider. Fixed sun: rise 6:30, noon 12:30, set 18:30.
const hourIn = document.getElementById("hour"), hourOut = document.getElementById("hourv");
let hourSet = q.has("hour") ? +q.get("hour") : null;
function hour() { if (hourSet != null) return hourSet; const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
function showHour() { const h = hour(); hourIn.value = h; hourOut.textContent = String(Math.floor(h)).padStart(2, "0") + ":" + String(Math.round(h % 1 * 60) % 60).padStart(2, "0"); }
hourIn.oninput = () => { hourSet = +hourIn.value; showHour(); if (document.body.classList.contains("open")) reset(); };
showHour();
// keyframes by sun elevation (-1 night .. 1 noon): zenith, horizon, sun colour
const KE = [-1, -.3, -.12, 0, .14, .4, 1];
const KZ = [[.01,.015,.04],[.03,.05,.12],[.13,.19,.36],[.33,.41,.56],[.55,.64,.74],[.72,.78,.84],[.74,.80,.86]];
const KH = [[.03,.04,.07],[.09,.09,.17],[.52,.40,.46],[.95,.60,.42],[.95,.80,.62],[.90,.91,.915],[.92,.93,.93]];
const KS = [[0,0,0],[0,0,0],[.7,.3,.25],[1,.52,.28],[1,.76,.5],[1,.95,.85],[1,.98,.94]];
const lerpK = (K, e) => { let i = 0; while (i < KE.length - 2 && e > KE[i + 1]) i++; const t = Math.min(1, Math.max(0, (e - KE[i]) / (KE[i + 1] - KE[i]))); return K[i].map((v, j) => v + (K[i + 1][j] - v) * t); };

function skyAt(h, w, H) {
	const L = H * .52, gx = w / 2, gy = H / 2;
	const el = Math.sin(Math.PI * (h - 6.5) / 12), mel = Math.sin(Math.PI * (h - 18.5) / 12);
	const pos = (hh, e) => [w * (.5 + (((hh - 12.5) % 24 + 36) % 24 - 12) / 6 * .42), L - e * L * 1.6];
	const S = pos(h, el), M = pos(h + 12, mel);
	const sc = lerpK(KS, el), day = sst(-.06, .12, el), warm = sst(-.2, -.02, el) * (1 - sst(.12, .35, el));
	const moon = sst(0, .15, mel) * (1 - sst(-.2, 0, el)) * .6;
	const src = day > .02 ? S : M, dx = (src[0] - gx) / H, dy = (src[1] - gy) / H, dl = Math.hypot(dx, dy, .6);
	const kc = day > .02 ? sc.map(v => v * .62 * day) : [1.15 * moon, 1.25 * moon, 1.5 * moon];

	if (day + moon < .05) pt.splice(0, 3, .78, .86, 1);
	return { ZC: lerpK(KZ, el), HC: hc, SC: sc, KD: [dx / dl, dy / dl, .6 / dl], KC: kc, PT: pt,
		SP: [S[0], S[1], sst(-.04, .03, el), warm], MP: [M[0], M[1], moon, 1 - sst(-.35, -.12, el)] };

// Camera: pinhole at eye height EH (m) over the water, horizon at 52% of the height (reference), gate D0 m ahead
// at the start. Scale: kasagi (15 m) 16% of the width, or 16 m gate height 10% of the height, whichever is smaller.
const D0 = 60, EH = 3.43;
const cam = (w, h) => ({ f: Math.min(.16 * w / 15, .1 * h / 16) * D0, L: h * .52 });
if (q.has("t")) document.body.style.setProperty("--t", q.get("t")); // prototype: freeze a dolly frame
const cv = document.getElementById("gl");
const gl = matchMedia("(prefers-reduced-motion: reduce)").matches ? null : cv.getContext("webgl", { antialias: false, alpha: false });
if (gl) {
	const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };

		raf = 0;
		if (document.body.classList.contains("open")) return;
		const dist = D0 * (1 - 1.1 * (parseFloat(getComputedStyle(document.body).getPropertyValue("--t")) || 0));
		const w = innerWidth, h = innerHeight, { f, L } = cam(w, h), s = app.style;

	// compiling before the zoom, then redraw the real start frame in the same task.
	const px = new Uint8Array(4);

		const now = performance.now();
		draw(now, 1, 1, 1, 1);
		gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
		draw(now, D0, 0, 0, 0);
	};
	glWarm();
	window.glStart = () => { if (!raf) raf = requestAnimationFrame(frame); };
	glStart();
}
