<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Splash H: full FFT water (Ultra-Water port)</title>
<style>
@property --t { syntax: "<number>"; inherits: true; initial-value: 0; }
/* --t: dolly progress 0..1. WebGL: JS maps it to a camera distance and drives the .app styles inline.
 * --z: equivalent 2D scale, only used by the no-WebGL fallback below. */
/* Gate opening in icon units: x 26..32, y 24..46, centre (29,35). Icon drawn at 96px: 1 unit = 1.5px.
 * Right leg ends at y 56, 31.5px below the opening centre; that is the waterline. */
:root { --k: 1; --bg: oklch(0.155 0 0); --raised: oklch(0.19 0 0); --fg: oklch(0.93 0 0); --mut: oklch(0.62 0 0); --gate: #c8442e; --line: calc(50vh + 31.5px); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 15px/1.4 system-ui, sans-serif; color: var(--fg); }
body { --t: 0; --z: calc(1 / max(.003, 1 - var(--t) * 1.1)); }
.run { animation: dolly calc(1300ms * var(--k)) cubic-bezier(.4, 0, .7, 1) calc(500ms * var(--k)) both; }
@keyframes dolly { to { --t: 1; } }
.scene {
	position: fixed; inset: 0;
	background:
		linear-gradient(to bottom, #eceded 0%, #dcdedf calc(var(--line) - 2px), #c3c9cb var(--line), #9aa6a9 calc(var(--line) + 6vh), #5d6f73 85%, #3c4b4f 100%);
	/* Scene moves far less than the gate: depth. */
	transform-origin: 50vw 50vh; transform: scale(calc(1 + (var(--z) - 1) * .002));
}
.reflect {
	position: absolute; width: 96px; height: 96px;
	left: calc(50vw - 43.5px); top: calc(var(--line) - 84px);
	transform-origin: 50% 87.5%; transform: scaleY(-1);
	opacity: .55; filter: url(#ripple) blur(.4px);
	-webkit-mask: linear-gradient(to top, #000 55%, transparent 88%); mask: linear-gradient(to top, #000 55%, transparent 88%);
}
.app {
	position: fixed; inset: 0; z-index: 1; background: var(--bg); padding: 20px; box-sizing: border-box;
	clip-path: inset(max(0px, 50vh - 16.5px * var(--z)) max(0px, 50vw - 4.5px * var(--z)));
	/* The opening spans the screen width near z 43; the app arrives only once we are through the gate. */
	opacity: clamp(0, (var(--z) - 42) / 10, 1);
	/* Arrives under the flash peak (z 47): opaque by z 52, blur/scale gone by z 100 (~150ms at normal speed). */
	transform: scale(calc(1 + clamp(0, (100 - var(--z)) / 53, 1) * .04));
	filter: blur(calc(clamp(0, (100 - var(--z)) / 53, 1) * 4px));
}
.gate {
	position: fixed; z-index: 2; width: 96px; height: 96px; pointer-events: none;
	left: calc(50vw - 43.5px); top: calc(50vh - 52.5px);
	transform-origin: 43.5px 52.5px; transform: scale(var(--z));
}
/* Flash veil: the app fades in under an opaque #f4f2ee veil (matching the canvas flash), which then lifts,
 * so the reveal goes white -> crisp app and never shows a translucent dark app over the light flash. */
.app::after {
	content: ""; position: fixed; inset: 0; pointer-events: none; background: #f4f2ee;
	opacity: var(--v, clamp(0, (62 - var(--z)) / 10, 1));
}
.open .app::after { display: none; }
.open .app { clip-path: none; opacity: 1; transform: none; filter: none; }
#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; }
.gl #gl { display: block; }
.gl .scene, .gl .gate { display: none; }
.open .gate, .open .scene, .open #gl { display: none; }
@media (prefers-reduced-motion: reduce) {
	.run { animation: none; }
	.run .gate, .run .scene, .run #gl { display: none; }
	.run .app { clip-path: none; opacity: 1; transform: none; filter: none; }
	.run .app::after { display: none; }
}
h1 { font-size: 26px; margin: 8px 0 18px; }
h2 { font-size: 12px; letter-spacing: .08em; color: var(--mut); margin: 18px 0 8px; font-weight: 500; }
.group { background: var(--raised); border-radius: 14px; overflow: hidden; }
.row { padding: 12px 14px; border-bottom: 1px solid var(--bg); display: flex; justify-content: space-between; }
.row:last-child { border: 0; }
.row span { color: var(--mut); font-size: 13px; }
.controls { position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 9; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
button { padding: 10px 16px; border: 0; border-radius: 12px; background: #222; color: #eee; font: inherit; }
button[aria-pressed="true"] { background: #c8442e; }
body.paused { animation-play-state: paused; }
.tod { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 12px; background: #222; color: #eee; font-size: 13px; }
.tod input { width: 84px; }
.tod output { min-width: 38px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
	<filter id="ripple" x="-20%" y="-20%" width="140%" height="140%">
		<feTurbulence type="fractalNoise" baseFrequency="0.02 0.35" numOctaves="2" seed="3" />
		<feDisplacementMap in="SourceGraphic" scale="7" xChannelSelector="R" yChannelSelector="G" />
	</filter>
	<linearGradient id="rockg" x1="0" y1="46" x2="0" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6b6f6c" /><stop offset=".12" stop-color="#5f665d" /><stop offset="1" stop-color="#2f3433" /></linearGradient>
</svg>
<div class="scene">
	<svg class="reflect" viewBox="0 0 64 64"><path fill="url(#rockg)" d="M8 56L10 53L12 52.4L14 49.5L16 48.5L17.5 45.8H26.5L28 49L29.5 51L31 56zM1 56L2.5 53.6L5 53L6 49.5L7.2 48.8L8.4 52L11 52.5L13.5 54L14 56zM27 56L28.5 54L30 53.6L31.4 54.2L32.6 53.2L34 56zM42 56L43.5 53.4L45.2 52.4L47 53L48.5 52.6L50 56z" /><path fill="var(--gate)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z" /></svg>
</div>
<canvas id="gl"></canvas>
<div class="app">
	<h1>Sessions</h1>
	<h2>MAC-STUDIO</h2>
	<div class="group">
		<div class="row">Refactor session store <span>2m</span></div>
		<div class="row">Splash research <span>14m</span></div>
		<div class="row">Fix rpc reconnect <span>1h</span></div>
	</div>
	<h2>BUILD-BOX</h2>
	<div class="group">
		<div class="row">Native rebuild <span>3h</span></div>
		<div class="row">Fingerprint test <span>1d</span></div>
	</div>
</div>
<svg class="gate" viewBox="0 0 64 64"><path fill="url(#rockg)" d="M8 56L10 53L12 52.4L14 49.5L16 48.5L17.5 45.8H26.5L28 49L29.5 51L31 56zM1 56L2.5 53.6L5 53L6 49.5L7.2 48.8L8.4 52L11 52.5L13.5 54L14 56zM27 56L28.5 54L30 53.6L31.4 54.2L32.6 53.2L34 56zM42 56L43.5 53.4L45.2 52.4L47 53L48.5 52.6L50 56z" /><path fill="var(--gate)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z" /></svg>
<div class="controls">
	<button id="play">Play</button>
	<button id="pause" aria-pressed="false">Pause</button>
	<button id="loop" aria-pressed="false">Loop</button>
	<button id="reset">Start frame</button>
	<label class="tod"><input id="hour" type="range" min="0" max="24" step="0.25" /><output id="hourv"></output></label>
</div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.style.setProperty("--k", q.has("slow") ? 5 : 1);
const loopBtn = document.getElementById("loop");
let looping = false;
let timer = 0;
const app = document.querySelector(".app");
function reset() {
	clearTimeout(timer);
	app.style.cssText = "";
	document.body.className = "";
	document.getElementById("pause").setAttribute("aria-pressed", "false");
	if (window.glStart) glStart();
}
function play() {
	reset();
	void document.body.offsetWidth;
	if (window.glWarm) glWarm();
	document.body.className = "run";
}
document.body.addEventListener("animationend", () => {
	app.style.cssText = "";
	document.body.classList.add("open");
	if (looping) timer = setTimeout(play, 1000);
});
document.getElementById("play").onclick = play;
document.getElementById("reset").onclick = () => { looping = false; loopBtn.setAttribute("aria-pressed", "false"); reset(); };
const pauseBtn = document.getElementById("pause");
pauseBtn.onclick = () => pauseBtn.setAttribute("aria-pressed", String(document.body.classList.toggle("paused")));
loopBtn.onclick = () => {
	looping = !looping;
	loopBtn.setAttribute("aria-pressed", String(looping));
	if (looping) play();
};

const FS = `precision highp float;
uniform vec2 R; uniform float T, L, D, F, CZ, EH, MZ; uniform vec3 P;
// MZ: morning mist / dusk aerial amount 0..1 (0 = clear air)
// time-of-day sky: zenith/horizon colour, sun colour (x intensity), key light dir/colour, portal tint
uniform vec3 ZC, HC, SC, KD, KC, PT;
uniform vec4 SP, MP; // sun px xy, sun vis, twilight warmth; moon px xy, moon light, stars
// ocean G-buffer (FFT surface pass): G0 = slope xz, roughness alpha^2, ray distance (0: no water); G1 = foam, height
uniform sampler2D G0, G1;
vec4 GA, GB;
const vec3 LAC = vec3(.88,.23,.1);
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
	return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
float h1(float i){ return fract(sin(i * 127.1) * 43758.5453); }
float lnz(float x){ float i = floor(x); return mix(h1(i), h1(i + 1.), fract(x)); }
vec3 sky(vec2 p, float sun){
	float hgt = max(L - p.y, 0.), ys = clamp(hgt / L, 0., 1.);
	vec3 c = mix(HC, ZC, pow(ys, .55));
	vec2 ds = (p - SP.xy) / R.y, dm = (p - MP.xy) / R.y;
	float sd = length(ds), md = length(dm);
	// dawn/dusk band: warm near the sun azimuth, along the horizon
	c += SC * SP.w * exp(-ys * 5.) * exp(-abs(ds.x) * 2.2) * .55;
	// sun: disc, glow, Mie halo
	c += SC * SP.z * sun * (smoothstep(.016, .012, sd) * 1.2 + exp(-sd * 14.) * .45 + exp(-sd * 3.) * .16);
	// stars: visibility from one hash, brightness/twinkle from independent hashes; a third stay steady
	if (MP.w > 0. && sun > 0.) {
		vec2 cl = floor(p / 5.), sp = cl * 5. + 1. + 3. * vec2(h21(cl + 7.), h21(cl + 3.));
		float hs = h21(cl), ha = h21(cl + 17.3), hb = h21(cl + 29.1), hc = h21(cl + 41.7);
		float tw = step(.33, hb) * (.2 + .45 * hc) * (.5 + .5 * sin(T * (.5 + 3.5 * ha) + hb * 43.));
		float st = step(.985, hs) * smoothstep(1.2, .2, length(p - sp)) * (.35 + .75 * hc * hc) * (1. - tw);
		c += vec3(.9,.93,1.) * st * MP.w * smoothstep(.02, .25, ys);
	}
	// moon
	c += vec3(.93,.95,1.) * MP.z * 3. * sun * (smoothstep(.012, .009, md) * 1.6 + exp(-md * 30.) * .45 + exp(-md * 6.) * .22);
	// aerial perspective: a thin band at the horizon, thicker only in morning mist
	float hz = exp(-hgt / (R.y * mix(.035, .26, MZ)));
	c = mix(c, HC, hz * (.12 + .23 * MZ));
	return c;
}
// REF: 1 while shading a rock seen in the water. Its mirrored silhouette shows the rock's sides and top
// bevel edge-on, so the view-dependent rim and the salt-bleached tops would draw a light outline there
float REF = 0.;
vec3 light(vec3 n, vec3 alb, float gl){
	float df = max(dot(n, KD), 0.);
	float sp = pow(max(dot(n, normalize(KD + vec3(0,0,1))), 0.), 36.) * gl;
	float am = .62 + .25 * (-n.y);
	vec3 amb = mix(HC, ZC, .6) * .8;
	// grazing rim tinted by the albedo: an untinted rim lit every face whose normal is perpendicular to the view (grey undersides)
	return alb * (amb * am + KC * df + KC * pow(1. - abs(n.z), 3.) * .5 * (1. - REF)) + (KC * 1.4 + amb * .2) * sp;
}
// World: metres, y up, z away from the camera, water at y 0, gate plane z 0, opening centred on x 0.
// Gate = logo path at .4 m per icon unit (icon x 29 -> x 0, icon y 56 -> y 0).
vec3 N; float M, G, AA, TA, T0, FP, HIT, RI, AM, ARI;
float sdB(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.) - r; }
float smin(float a, float b, float k){ float h = clamp(.5 + .5 * (b - a) / k, 0., 1.); return mix(b, a, h) - k * h * (1. - h); }
// tapered round post: inner face stays at |x| 1.2 (the opening), outer face tapers 1.42 -> 1.2 m radius
float post(vec3 p, float s, float y0){
	float r = mix(1.42, 1.2, clamp(p.y / 12.9, 0., 1.));
	float dr = (length(vec2(p.x - s * (1.2 + r), p.z)) - r) * .97, dy = abs(p.y - (y0 + 13.4) * .5) - (13.4 - y0) * .5;
	return length(max(vec2(dr, dy), 0.)) + min(max(dr, dy), 0.);
}
// pi: two posts, lacquered shimaki band 12.8..15.2, black kasagi with a gentle upward sweep to rounded tips
float gd(vec3 p){
	float a = min(post(p, -1., 2.), post(p, 1., -.5));
	float b = sdB(p - vec3(1.2, 14., 0.), vec3(7.2, 1.2, 1.5), .22);
	float x = p.x - 1.2, f = smoothstep(4.5, 7.7, abs(x));
	float c = sdB(vec3(x, p.y - 15.62 - .003 * x * x - .275 * f * f, p.z), vec3(7.7, .42 + .06 * f, 1.9), .2) * .85;
	G = c < min(a, b) ? 3. : a < b - .04 ? 1. : 2.;
	return min(smin(a, b, .3), c);
}
vec3 nrm(vec3 p){
	const vec2 k = vec2(1., -1.) * .015;
	return normalize(k.xyy * gd(p + k.xyy) + k.yyx * gd(p + k.yyx) + k.yxy * gd(p + k.yxy) + k.xxx * gd(p + k.xxx));
}
// raymarch only inside the gate's AABB, <= 48 steps; aa: record closest miss for edge coverage
float gTrace(vec3 ro, vec3 rd, float t, bool aa){
	vec3 iv = 1. / rd, t0 = (vec3(-6.8, -.6, -2.) - ro) * iv, t1 = (vec3(9.2, 16.7, 2.) - ro) * iv, mn = min(t0, t1), mx = max(t0, t1);
	float tn = max(max(mn.x, mn.y), mn.z), tf = min(min(min(mx.x, mx.y), mx.z), t);
	if (tf < max(tn, 0.)) return t;
	float s = max(tn, 0.), pf = 1. / (F * D), mr = 1e9, ms = 0.;
	for (int i = 0; i < 48; i++) {
		vec3 p = ro + rd * s;
		float d = gd(p), e = (s + T0) * pf;
		if (d < e * .1) { M = G; N = nrm(p); return s; }
		if (aa && d < mr * e) { mr = d / e; ms = s; }
		s += d;
		if (s > tf) break;
	}
	if (aa && .5 - mr > AA) { AA = .5 - mr; TA = ms; AM = 0.; }
	return t;
}
// eroded sea rocks: SDF = ellipsoid (+ plinth under the left post) displaced by lumpy + ridged fbm
float h31(vec3 p){ p = fract(p * .3183099 + .1) * 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
	return mix(mix(mix(h31(i), h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
		mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z); }
void rp(float i, out vec3 c, out vec3 r){
	if (i < .5) { c = vec3(-3.2, 0., .2); r = vec3(2., 4.4, 2.7); }       // rock under the left leg
	else if (i < 1.5) { c = vec3(24., 0., 70.); r = vec3(3.4, 1.9, 2.6); } // small rocks right, far
	else { c = vec3(27.6, 0., 72.); r = vec3(1.6, 1., 1.4); }
}
float RKS = .7; // step factor of the last rk() branch (its Lipschitz bound)
// SM: cheap rock mode for the portal's blurred samples (flash + radial blur hide it): no ridged octaves,
// longer steps, <= 16 steps; rock pixels themselves never reach the samples (the undisturbed view is kept there)
float SM = 0.;
// e: pixel footprint (m) at p; octaves whose period drops under ~2 px fade to their mean (LOD, no shimmer)
float rk(vec3 p, float i, float e){
	vec3 c, r; rp(i, c, r);
	vec3 q = p - c; float s = min(r.x, min(r.y, r.z));
	float k0 = length(q / r), d = k0 * (k0 - 1.) / length(q / (r * r));
	float fade = 1.;
	if (i < .5) {
		// plinth the post stands on; displacement fades toward the post foot so no pit opens under it
		float pr = length(p.xz - vec2(-2.62, 0.));
		d = smin(d, max(pr - 1.3, abs(p.y - .9) - 1.4), .7);
		fade = mix(smoothstep(1.1, 1.7, pr), 1., smoothstep(1.4, .6, p.y));
	}
	// displacement is bounded by .29 s: far from the surface return a safe bound without any noise (1-Lipschitz: full step)
	RKS = 1.;
	if (d > s * .35) return d - s * .3;
	RKS = .7;
	vec3 u = q * (2.2 / s) + i * 17.;
	// big lumps break the ellipsoid silhouette; ridged octaves carve eroded grooves and pits
	float lump = (n3(u * .35) - .5) * .9 + (n3(u * .8 + 5.) - .5) * .45;
	d -= s * lump * .32;
	RKS = .69; // marks the detailed branch: only its distance is a true surface distance
	if (d > s * .12) return d - s * .08;
	RKS = .7;
	// octave k has a period of s / (2.2 (1.6 + 1.9 k)) m; ex: pixels per unit octave frequency
	// reflection rays (T0 > 0) see the rock through ripples and desaturation: fine octaves drop 4x earlier
	float rg = 0., a = .5, ex = s / (2.2 * max(e, 1e-4)) / (T0 > 0. ? 4. : 1.) * (1. - SM);
	for (int k = 0; k < 3; k++) {
		float fr = 1.6 + float(k) * 1.9, w = smoothstep(1.5, 3., ex / fr);
		if (w <= 0.) { rg += .514 * (2. * a - .125); break; } // remaining octaves at their mean
		float n = 1. - abs(2. * n3(u * fr + float(k) * 3.1) - 1.);
		rg += a * mix(.514, n * n, w); u = u.yzx; a *= .5;
	}
	d -= s * (rg - .45) * .16 * fade;
	return d;
}
vec3 rnrm(vec3 p, float i, float h){
	vec2 k = vec2(1., -1.) * h;
	return normalize(k.xyy * rk(p + k.xyy, i, h) + k.yyx * rk(p + k.yyx, i, h) + k.yxy * rk(p + k.yxy, i, h) + k.xxx * rk(p + k.xxx, i, h));
}
// raymarch one rock inside its bounds, <= 40 steps, step scaled for the displacement's Lipschitz bound
// bounds: box = ellipsoid + displacement (.3 s) clipped to the water, intersected with the ellipsoid scaled by 1.35
// (contains the .3 s offset surface); the left rock's plinth lies inside both
float rTrace(vec3 ro, vec3 rd, float t, bool aa, float i){
	vec3 c, r; rp(i, c, r);
	vec3 m = r + min(r.x, min(r.y, r.z)) * .3 + .05, lo = c - m, hi = c + m; lo.y = -.05;
	vec3 iv = 1. / rd, t0 = (lo - ro) * iv, t1 = (hi - ro) * iv, mn = min(t0, t1), mx = max(t0, t1);
	float tn = max(max(mn.x, mn.y), mn.z), tf = min(min(min(mx.x, mx.y), mx.z), t);
	if (tf < max(tn, 0.)) return t;
	vec3 eo = (ro - c) / (r * 1.35), ed = rd / (r * 1.35);
	float ea = dot(ed, ed), eb = dot(eo, ed), ec = dot(eo, eo) - 1., eh = eb * eb - ea * ec;
	if (eh < 0.) return t;
	eh = sqrt(eh);
	tn = max(tn, (-eb - eh) / ea); tf = min(tf, (-eb + eh) / ea);
	if (i < .5) {
		// the left post is solid inside a vertical cylinder (x -2.5, r 1.05, y 2.05..12.9): nothing behind its entry is visible
		vec2 co = ro.xz - vec2(-2.5, 0.), cd = rd.xz;
		float ca = dot(cd, cd), cb = dot(co, cd), ch = cb * cb - ca * (dot(co, co) - 1.1025);
		if (ch > 0.) { float tc = (-cb - sqrt(ch)) / ca, yc = ro.y + rd.y * tc; if (tc > 0. && yc > 2.05 && yc < 12.9) tf = min(tf, tc); }
	}
	if (tf < max(tn, 0.)) return t;
	float s = max(tn, 0.), pf = 1. / (F * D), mr = 1e9, ms = 0., d = 1e9;
	for (int k = 0; k < 40; k++) {
		if (SM > .5 && k >= 16) break;
		vec3 p = ro + rd * s;
		float e = (s + T0) * pf; d = rk(p, i, e);
		if (d < e * .12) break;
		// only the detailed branch measures the true distance; the bound branches underestimate it and would fake a near miss
		if (aa && RKS == .7 && d < mr * e) { mr = d / e; ms = s; }
		s += d * min(1., RKS * (1. + SM * .3));
		if (s > tf) break;
	}
	// converged, or out of steps while still creeping along the surface (grazing rays): a hit, not a hole
	if (s <= tf && d < .02 + (s + T0) * pf) { vec3 p = ro + rd * s; M = 4.; RI = i; N = rnrm(p, i, max(.02, (s + T0) * pf)); return s; }

		gw = w; gh = h; gA = tex(w, h, gl.RGBA16F); gB = tex(w, h, gl.RGBA16F);
		gD = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, gD); gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
		gF = fbo([gA, gB], gD);
	}
	const SU = {}; for (const k of ["ZC","HC","SC","KD","KC","PT","SP","MP","MZ"]) SU[k] = pM.U(k);
	const uP = pM.U("P"), uR = pM.U("R"), uT = pM.U("T"), uL = pM.U("L"), uD = pM.U("D"), uF = pM.U("F"), uC = pM.U("CZ");
	gl.useProgram(pM.p); gl.uniform1f(pM.U("EH"), EH); gl.uniform1i(pM.U("G0"), 0); gl.uniform1i(pM.U("G1"), 1);
	document.documentElement.classList.add("gl");
	let raf = 0, t0 = performance.now();
	const cl = v => Math.min(1, Math.max(0, v));
	function frame(now) {
		raf = 0;
		if (document.body.classList.contains("open")) return;
		const dist = D0 * (1 - 1.1 * (parseFloat(getComputedStyle(document.body).getPropertyValue("--t")) || 0));
		const w = innerWidth, h = innerHeight, { f, L } = cam(w, h), s = app.style;
		// app: clipped to the projected opening, appears as the camera crosses the gate plane (dist 0)
		if (dist > .05) {
			const k = f / dist, x = w / 2 - 1.2 * k, y = L - (12.8 - EH) * k, b = L + EH * k, px = v => Math.max(0, v).toFixed(1) + "px";
			s.clipPath = `inset(${px(y)} ${px(x)} ${px(h - b)} ${px(x)})`;
		} else s.clipPath = "none";
		const st = cl(1 + dist / 6); // blur/scale settle over the last 6 m
		s.opacity = cl(-dist / .5);
		s.transform = `scale(${1 + st * .04})`;
		s.filter = `blur(${st * 4}px)`;
		s.setProperty("--v", cl(1 + (dist + .5) / 3.5)); // veil lifts over dist -0.5..-4
		// canvas is covered once the app is opaque
		if (dist > -.5) {
			const z = D0 / Math.max(dist, .01); // apparent scale of the opening vs the start frame
			draw(now, dist, cl((z - 1) / 24), cl((z - 25) / 20), Math.exp(-(((dist - .3) / (dist > .3 ? 1.4 : .8)) ** 2)));
		}
		if (q.has("perf")) (window.fi ||= []).push(now);
		raf = requestAnimationFrame(frame);
	}
	function draw(now, dist, pa, pc, pf) {
		// ?frz=<s>: freeze sim/shader time (deterministic shots and pixel diffs)
		const w = innerWidth, h = innerHeight, c = cam(w, h), t = q.has("frz") ? +q.get("frz") : (now - t0) / 1000;
		let dpr = Math.min(devicePixelRatio || 1, 2);
		if (w * h * dpr * dpr > 1.5e6) dpr = Math.sqrt(1.5e6 / (w * h));
		const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
		if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
		sim(t);
		gbuf(bw, bh);
		gl.bindFramebuffer(FB, gF); gl.viewport(0, 0, bw, bh);
		gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
		gl.useProgram(pO.p); gl.bindVertexArray(vm); bind([OD[0], OD[1], OD[2], OS[0], OS[1], OS[2], OS[3]]);
		gl.uniform3f(uOC, 0, EH, -dist); gl.uniform4f(uOP, 2 * c.f / w, 2 * c.f / h, 1 - 2 * c.L / h, DA); gl.uniform1f(uOT, t);
		gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_INT, 0);
		gl.disable(gl.DEPTH_TEST);
		gl.bindFramebuffer(FB, null); gl.viewport(0, 0, bw, bh);
		gl.useProgram(pM.p); gl.bindVertexArray(vq); bind([gA, gB]);
		gl.uniform2f(uR, w, h); gl.uniform1f(uT, t); gl.uniform1f(uL, c.L);
		gl.uniform1f(uF, c.f); gl.uniform1f(uC, -dist); gl.uniform1f(uD, bw / w);
		const k = skyAt(hour(), w, h);
		for (const n in k) (k[n].length === 4 ? gl.uniform4fv : k[n].length === 3 ? gl.uniform3fv : gl.uniform1fv).call(gl, SU[n], k[n]);
		// portal: approach, crossing, flash (peaks just before the gate plane)
		gl.uniform3f(uP, pa, pc, pf);
		gl.drawArrays(gl.TRIANGLES, 0, 3);
	}
	// Warm-up: run every branch (membrane, radial blur, flash) once so the driver finishes
	// compiling before the zoom, then redraw the real start frame in the same task.
	const px = new Uint8Array(4);
	window.glWarm = () => {
		const now = performance.now();
		draw(now, 1, 1, 1, 1);
		gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
		draw(now, D0, 0, 0, 0);
	};
	glWarm();
	window.glStart = () => { if (!raf) raf = requestAnimationFrame(frame); };
	glStart();
}
</script>
