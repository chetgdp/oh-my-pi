<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="color-scheme" content="light dark" />
		<!-- Keep in sync with --bg-raised in src/styles/tokens.css. -->
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16111c" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<title>ompgui</title>
		<style>
			:root { --bg: #16111c; --fg: #e8e5eb; --mut: #a69fb0; --fnt: #6e6579; --acc: #ed4abf; }
			@media (prefers-color-scheme: light) { :root { --bg: #fff; --fg: #3d3444; --mut: #6c5f78; --fnt: #8d7e9b; --acc: #d82b9a; } }
			body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
			.load-shell { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; gap: 12px; }
			.load-spin { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid color-mix(in oklch, var(--fnt) 45%, transparent); border-top-color: var(--acc); animation: load-spin .75s linear infinite; }
			.load-title { font-size: 14px; font-weight: 500; }
			.load-delayed { font-size: 12px; color: var(--mut); opacity: 0; animation: load-rev .4s ease-out 8s both; text-align: center; }
			.load-delayed a { color: var(--acc); margin-left: 6px; }
			@keyframes load-spin { to { transform: rotate(360deg); } }
			@keyframes load-rev { to { opacity: 1; } }
			@media (prefers-reduced-motion: reduce) {
				.load-spin { animation: pulse 1.6s ease-in-out infinite; }
				@keyframes pulse { 50% { opacity: .4; } }
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div class="load-shell" role="status" aria-live="polite">
				<div class="load-spin" aria-hidden="true"></div>
				<div class="load-title">Loading ompgui…</div>
				<div class="load-delayed">
					Still loading. Slow network or server down?
					<a href="">Reload</a>
				</div>
			</div>
		</div>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
