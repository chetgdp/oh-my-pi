<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Round 3, J: Now card</title>
<style>
:root {
	--bg: oklch(0.985 0.004 307);
	--raised: #fff;
	--inset: oklch(0.95 0.006 307);
	--fg: oklch(0.26 0.03 307);
	--muted: oklch(0.46 0.03 307);
	--faint: oklch(0.58 0.025 307);
	--accent: oklch(0.62 0.23 341);
	--accent-soft: oklch(0.62 0.23 341 / 12%);
	--ok: oklch(0.55 0.13 150);
	--warn: oklch(0.62 0.14 70);
	--warn-soft: oklch(0.75 0.14 80 / 18%);
	--err: oklch(0.55 0.19 25);
	--err-soft: oklch(0.55 0.19 25 / 10%);
	--border: oklch(0 0 0 / 10%);
	--border-strong: oklch(0 0 0 / 16%);
	--backdrop: oklch(0.4 0.02 307 / 30%);
	--bubble: #007aff;
	--hit: 44px;
	--ui: "Atkinson Hyperlegible Next", -apple-system, system-ui, sans-serif;
	--mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--ui); -webkit-text-size-adjust: 100%; }
button, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- lab chrome ---------- */
.lab { height: 100svh; overflow-y: auto; scroll-snap-type: y mandatory; }
.lab > section { scroll-snap-align: start; min-height: 100svh; }
.intro { padding: calc(env(safe-area-inset-top) + 20px) 20px 28px; max-width: 760px; }
.intro h1 { font-size: 22px; margin: 0 0 6px; }
.intro p, .intro li { color: var(--muted); }
.intro ul { padding-left: 20px; margin: 4px 0; }
.intro li { margin: 6px 0; }
.intro b { color: var(--fg); }
.intro a { color: var(--accent); }
.v { display: flex; flex-direction: column; height: 100svh; }
.cap { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--inset); border-bottom: 1px solid var(--border); font-size: 13px; }
.cap b { font-size: 14px; white-space: nowrap; }
.cap .sp { flex: 1; }
.cap select { min-width: 0; flex: 1; max-width: 190px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 4px 8px; background: var(--raised); font-size: 13px; }
.cap .nav { display: flex; gap: 4px; }
.cap .nav button { width: 30px; height: 30px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--raised); display: grid; place-items: center; }
.cap .nav svg { width: 16px; height: 16px; }
.note { flex: none; padding: 6px 12px; font-size: 12px; color: var(--accent); background: var(--inset); border-bottom: 1px solid var(--border); }
@media (min-width: 760px) {
	.lab { scroll-snap-type: none; display: flex; flex-wrap: wrap; gap: 32px; padding: 24px; justify-content: center; align-items: flex-start; }
	.lab > section { min-height: 0; }
	.intro { width: 100%; padding: 0; }
	.v { height: auto; width: 377px; }
	.cap, .note { background: none; border: 0; padding: 0 2px 8px; }
	.phone { flex: none !important; height: 812px; border: 1px solid var(--border-strong); border-radius: 40px; overflow: hidden; box-shadow: 0 12px 32px oklch(0 0 0 / 12%); }
}

/* ---------- phone ---------- */
.phone { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.sb { flex: none; height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-weight: 600; }
@media (max-width: 759px) { .sb { display: none; } }

/* session page: top bar, transcript and now card */
.track { flex: 1; min-height: 0; display: flex; position: relative; }
.pg { flex: 0 0 100%; min-width: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }

/* top bar (kept from round 2) */
.tb { flex: none; display: flex; align-items: center; gap: 2px; height: 56px; padding: 0 6px 0 2px; background: var(--raised); border-bottom: 1px solid var(--border); }
.ib { position: relative; width: var(--hit); height: var(--hit); display: grid; place-items: center; border-radius: 12px; color: var(--muted); flex: none; }
.ib:active { background: var(--inset); }
.back { flex: none; height: var(--hit); display: flex; align-items: center; gap: 0; padding: 0 4px 0 2px; border-radius: 12px; color: var(--muted); }
.back:active { background: var(--inset); }

.bk { flex: none; height: var(--hit); display: flex; align-items: center; padding: 0 6px 0 2px; border-radius: 12px; color: var(--accent); font-weight: 700; font-size: 14px; }
.title { flex: 1; min-width: 0; height: var(--hit); display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 0 4px; border-radius: 10px; }
.title:active { background: var(--inset); }
.t1 { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; min-width: 0; }
.t1 .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t1 svg { width: 14px; height: 14px; color: var(--faint); }
.live { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; min-width: 0; }
.live.wait { color: var(--warn); font-weight: 700; }
.live.bad { color: var(--err); font-weight: 700; }
.live.ghost { color: var(--accent); font-weight: 700; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.sdot.run { background: var(--accent); animation: pulse 1.2s infinite; }
.sdot.wait { background: var(--warn); }
.sdot.bad { background: var(--err); }
.sdot.idle { background: var(--faint); }
.sdot.compacting { background: var(--warn); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* banner */
.ban { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 14px; font-size: 14px; border-bottom: 1px solid var(--border); }
.ban .grow { flex: 1; }
.ban.bad { background: var(--err-soft); color: var(--err); }
.ban .act { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid currentColor; font-size: 13px; font-weight: 700; position: relative; }
.ban .act::after { content: ""; position: absolute; inset: -6px -2px; }

/* transcript */
.tr { flex: 1; min-height: 0; overflow: hidden; padding: 14px 24px 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
.bub { align-self: flex-end; max-width: 82%; background: var(--bubble); color: #fff; padding: 9px 14px; border-radius: 18px; }
.bub.q { background: var(--inset); color: var(--muted); border: 1px dashed var(--border-strong); display: flex; gap: 8px; align-items: center; }
.bub.q small { display: block; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }
.bub.q svg { width: 16px; height: 16px; }
.mark { align-self: center; font-size: 12px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.mark svg { width: 14px; height: 14px; }
.at { color: var(--fg); }
.at code { font-family: var(--mono); font-size: 13px; background: var(--inset); padding: 1px 4px; border-radius: 3px; }
.tool { border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.tool b { color: var(--fg); }
.tool .el { margin-left: auto; font-family: var(--ui); color: var(--faint); font-size: 12px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: rot 1s linear infinite; flex: none; }
.ok-ic { color: var(--ok); width: 14px; height: 14px; }
@keyframes rot { to { transform: rotate(1turn); } }

/* the "now" card */
.now { flex: none; margin: 0 10px 8px; border: 1px solid var(--border-strong); border-radius: 16px; background: var(--raised); overflow: hidden; box-shadow: 0 2px 10px oklch(0 0 0 / 5%); }
.now.wait { border-color: var(--warn); border-width: 1.5px; }
.now.hot { border-color: var(--err); }
.now.bad { border-color: var(--err); }
.nh { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--hit); padding: 0 8px 0 12px; text-align: left; font-size: 14px; }
.nh .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nh .lbl b { font-weight: 700; }
.nh .meta { flex: none; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.nh .meta span { display: inline-flex; align-items: center; gap: 3px; }
.nh .meta svg { width: 14px; height: 14px; }
.nh > svg { width: 16px; height: 16px; color: var(--faint); }
.prog { height: 3px; background: var(--inset); }
.prog i { display: block; height: 100%; background: var(--accent); }
.nb { border-top: 1px solid var(--border); max-height: 340px; overflow: hidden; }
.sec { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 10px 12px 2px; display: flex; }
.sec span { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.later { margin-left: auto; height: var(--hit); margin-right: -8px; padding: 0 10px; color: var(--muted); font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 700; }
.todo { display: flex; gap: 10px; align-items: flex-start; padding: 6px 12px; font-size: 14px; }
.todo .bx { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong); flex: none; display: grid; place-items: center; margin-top: 1px; }
.todo.done .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo.done .bx svg { width: 12px; height: 12px; }
.todo.cur .bx { border-color: var(--accent); }
.todo.cur { color: var(--accent); font-weight: 700; }
.todo.done span { color: var(--faint); text-decoration: line-through; }
.ag { display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--hit); padding: 0 8px 0 12px; text-align: left; font-size: 14px; }
.ag:active { background: var(--inset); }
.ag .nm { font-weight: 700; }
.ag .st { color: var(--muted); font-size: 12px; display: block; }
.ag > span:nth-child(2) { flex: 1; min-width: 0; }
.ag > svg { width: 16px; height: 16px; color: var(--faint); }
.nact { display: flex; gap: 8px; padding: 8px 12px 12px; }
.nact button { flex: 1; height: var(--hit); border-radius: 12px; font-weight: 700; border: 1px solid var(--border-strong); font-size: 14px; }
.nact .pri { background: var(--accent); color: #fff; border-color: transparent; }
.nact .red { background: var(--err); color: #fff; border-color: transparent; }
.q { font-weight: 700; padding: 2px 12px 6px; }
.opt { display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); margin: 0 12px 8px; min-height: var(--hit); padding: 4px 12px; border: 1px solid var(--border-strong); border-radius: 12px; text-align: left; }
.opt small { color: var(--faint); display: block; font-size: 12px; }
.opt svg { margin-left: auto; width: 16px; height: 16px; color: var(--faint); }
.hint { font-size: 12px; color: var(--faint); padding: 0 12px 10px; }
.meter { margin: 6px 12px 4px; height: 8px; border-radius: 4px; background: var(--inset); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.crit i { background: var(--err); }
.n-crit { color: var(--err); font-weight: 700; }

/* composer (kept from round 2) */
.cmp { flex: none; padding: 8px 10px 10px; background: var(--raised); border-top: 1px solid var(--border); }
.row { display: flex; align-items: flex-end; gap: 8px; }
.field { flex: 1; min-width: 0; min-height: var(--hit); display: flex; align-items: center; gap: 4px; border: 1px solid var(--border-strong); border-radius: 22px; background: var(--inset); padding: 0 4px 0 6px; }
.field.focus { border-color: var(--accent); background: var(--raised); }
.field .ph { flex: 1; min-width: 0; padding: 11px 6px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .ph.typed { color: var(--fg); }
.field .ib { width: 36px; height: 36px; }
.mode { flex: none; height: 32px; padding: 0 10px; border-radius: 16px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.mode.steer { background: var(--accent-soft); color: var(--accent); }
.mode.queue { background: var(--inset); color: var(--fg); border: 1px solid var(--border-strong); }
.mode.lock { opacity: .7; }
.mode svg { width: 14px; height: 14px; }
.rb { flex: none; width: var(--hit); height: var(--hit); border-radius: 22px; display: grid; place-items: center; }
.rb.send { background: var(--accent); color: #fff; }
.rb.send.queue { background: var(--fg); }
.rb.send.off { opacity: .35; }
.rb.stop { background: var(--err-soft); color: var(--err); border: 1.5px solid var(--err); }
.rb.stop svg { fill: currentColor; stroke: none; width: 14px; height: 14px; }

/* keyboard mock */
.kbd { flex: none; height: 336px; background: #d1d3d9; display: flex; flex-direction: column; }
.kbd .acc { height: 45px; background: #f2f2f4; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #1a7cf5; font-weight: 600; border-bottom: 1px solid #c8c8cc; }
.kbd .acc span { color: #b0b0b5; letter-spacing: 8px; }
.kbd .keys { flex: 1; display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 10px 4px 36px; }
.kbd .keys div { display: flex; gap: 6px; justify-content: center; }
.kbd .keys i { flex: 0 0 31px; background: #fff; border-radius: 5px; box-shadow: 0 1px 0 #898a8d; }
.kbd .keys .wide i { flex: 0 0 auto; width: 190px; }

/* settings: the page drops down from the title */
.scrim { position: absolute; inset: 0; background: var(--backdrop); z-index: 8; }
.drop { position: absolute; left: 0; right: 0; top: 0; z-index: 9; background: var(--raised); border-radius: 0 0 20px 20px; box-shadow: 0 10px 28px oklch(0 0 0 / 18%); max-height: 92%; display: flex; flex-direction: column; overflow: hidden; }
.drop .tb { border-bottom: 1px solid var(--border); }
.drop .body { overflow: hidden; padding: 4px 0 6px; }
.drop .grab { flex: none; height: 18px; display: grid; place-items: center; }
.drop .grab i { width: 36px; height: 5px; border-radius: 3px; background: var(--border-strong); }
.grp { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 10px 16px 4px; display: flex; }
.grp span { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.seg { display: flex; margin: 0 12px; border-radius: 12px; background: var(--inset); padding: 3px; gap: 2px; }
.seg button { flex: 1; height: 38px; border-radius: 9px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--raised); color: var(--fg); font-weight: 700; box-shadow: 0 1px 3px oklch(0 0 0 / 12%); }
.li { display: flex; align-items: center; gap: 12px; min-height: var(--hit); padding: 0 16px; width: 100%; text-align: left; font-size: 15px; }
.li:active { background: var(--inset); }
.li > svg { color: var(--muted); }
.li .v2 { margin-left: auto; color: var(--faint); font-size: 13px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.li .v2 svg { width: 16px; height: 16px; }
.li.red, .li.red > svg { color: var(--err); }
.li.off { opacity: .45; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--border-strong); position: relative; margin-left: auto; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px oklch(0 0 0 / 25%); }
.sw.on { background: var(--ok); }
.sw.on::after { left: 21px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 4px 12px 6px; }
.tiles button { height: 60px; border-radius: 12px; background: var(--inset); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--fg); }
.tiles button svg { color: var(--muted); }
.tiles button.red { color: var(--err); }
.tiles button.red svg { color: var(--err); }
.tiles button.off { opacity: .4; }
.foot { font-size: 12px; color: var(--faint); padding: 2px 16px 4px; }

</style>
</head>
<body>
<div class="lab" id="lab"></div>
<script>
const I = {
	back: '<path d="M15 18l-6-6 6-6"/>',
	chev: '<path d="M9 6l6 6-6 6"/>',
	down: '<path d="M6 9l6 6 6-6"/>',
	upc: '<path d="M6 15l6-6 6 6"/>',
	up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
	stop: '<rect x="5" y="5" width="14" height="14" rx="2"/>',
	clip: '<path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',
	todo: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
	bot: '<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9.5 13h0M14.5 13h0"/>',
	x: '<path d="M6 6l12 12M18 6L6 18"/>',
	clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
	cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
	plan: '<path d="M4 6h16M4 12h10M4 18h6"/>',
	shrink: '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
	hand: '<path d="M5 12h14M13 6l6 6-6 6"/>',
	eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
	vol: '<path d="M11 5L6 9H2v6h4l5 4zM16 9a5 5 0 0 1 0 6"/>',
	pen: '<path d="M17 3l4 4L7 21H3v-4z"/>',
	info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h0"/>',
	dollar: '<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
	wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20h0"/>',
	trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
	reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
	plus: '<path d="M12 5v14M5 12h14"/>',
	hub: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
	ghost: '<path d="M5 21V10a7 7 0 0 1 14 0v11l-3-2-2 2-2-2-2 2-2-2z"/><path d="M9.5 10h0M14.5 10h0"/>',
	queue: '<path d="M4 6h16M4 12h16M4 18h9"/>',
	bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
	check: '<path d="M5 12l5 5L20 7"/>',
	brain: '<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a3 3 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
};
const ic = (n, extra = "") => `<svg viewBox="0 0 24 24" ${extra}>${I[n]}</svg>`;

const STATES = [
	["idle", "Idle"],
	["busy", "Streaming"],
	["now", "Streaming, now card open"],
	["typing", "Streaming, keyboard up, queueing"],
	["ask", "Needs you: ask"],
	["plan", "Needs you: plan approval"],
	["hot", "Context 88%"],
	["compact", "Compacting"],
	["offline", "Disconnected"],
	["focus", "Focused subagent"],
	["settings", "Settings (tap title)"],
];

const TITLE = "🖥️ WEBGUI: Review webgui package context";

function model(s) {
	const busy = ["busy", "now", "typing", "compact", "focus", "hot", "settings"].includes(s);
	return {
		s, busy,
		wait: s === "ask" || s === "plan",
		kbd: s === "typing",
		offline: s === "offline",
		focus: s === "focus",
		compact: s === "compact",
		ctx: s === "hot" ? 88 : 41,
		mode: s === "typing" || s === "compact" ? "queue" : "steer",
	};
}

function liveParts(m) {
	if (m.wait) return { cls: "wait", dot: "wait", text: m.s === "plan" ? "needs you · plan ready · 1m" : "needs you · question · 1m" };
	if (m.offline) return { cls: "bad", dot: "bad", text: "disconnected · retrying" };
	if (m.focus) return { cls: "ghost", dot: "run", text: "subagent of WEBGUI · edit · 40s" };
	if (m.compact) return { cls: "", dot: "compacting", text: "compacting · 12s" };
	if (m.busy) return { cls: "", dot: "run", text: "bash · bun test · 2m14s" };
	return { cls: "", dot: "", text: "idle · 3m · Opus 5.5" };
}

function backBtn() {
	return `<button class="back" aria-label="back to sessions">${ic("back")}</button>`;
}

function topBar(m) {
	const lp = liveParts(m);
	if (m.focus) {
		return `<div class="tb">
			<button class="bk" data-go="busy" aria-label="back to main agent">${ic("back")}Main</button>
			<button class="title" data-go="settings">
				<span class="t1"><span class="tx">👻 ComposerAudit</span>${ic("down")}</span>
				<span class="live ghost"><span class="sdot run"></span><span>${lp.text}</span></span>
			</button>
		</div>`;
	}
	return `<div class="tb">
		${backBtn()}
		<button class="title" data-go="settings">
			<span class="t1"><span class="tx">${TITLE}</span>${ic("down")}</span>
			<span class="live ${lp.cls}"><span class="sdot ${lp.dot}"></span><span>${lp.text}</span></span>
		</button>
	</div>`;
}


function transcript(m) {
	if (m.focus) {
		return `<div class="tr">
			<div class="bub">Audit the composer busy state</div>
			<div class="at">Reading <code>Composer.tsx</code> to map the busy-state controls.</div>
			<div class="tool">${ic("check", 'class="ok-ic"')}<b>read</b> Composer.tsx:380-440</div>
			<div class="tool"><span class="spin"></span><b>edit</b> composer.css<span class="el">40s</span></div>
		</div>`;
	}
	const running = m.busy && !m.compact;
	let tail = "";
	if (running && m.s !== "typing") tail += `<div class="bub q">${ic("clock")}<span><small>Queued · sends after this turn</small>Run the webgui tests</span>${ic("x")}</div>`;
	if (m.compact) tail += `<div class="mark"><span class="spin"></span>Compacting · new messages will queue</div>`;
	return `<div class="tr">
		<div class="bub">Retool the prototypes</div>
		<div class="at">Reading the three critiques, then rebuilding around one shared component set.</div>
		<div class="tool">${ic("check", 'class="ok-ic"')}<b>read</b> critique-CritiqueSystem.md</div>
		${running ? `<div class="mark">${ic("bolt")}Steer delivered at tool boundary</div>` : ""}
		<div class="tool">${running ? '<span class="spin"></span>' : ic("check", 'class="ok-ic"')}<b>bash</b> bun test<span class="el">${running ? "2m14s" : "2m40s"}</span></div>
		${tail}
	</div>`;
}

const TODOS = [
	["Read the three critiques", "done"],
	["Map every control to one home", "done"],
	["Build the page", "done"],
	["Draw the now card", "cur"],
	["Verify at 375x812", ""],
];
function todoList() {
	return TODOS.map(([t, c]) => `<div class="todo ${c}"><span class="bx">${c === "done" ? ic("check") : ""}</span><span>${t}</span></div>`).join("");
}
function agentList() {
	const a = (nm, meta, run) => `<button class="ag" data-go="focus"><span class="sdot ${run ? "run" : "idle"}"></span><span><span class="nm">${nm}</span><span class="st">${meta}</span></span>${ic("chev")}</button>`;
	return a("ComposerAudit", "task · edit composer.css · 40s", true) + a("TopBarAudit", "scout · read TopBar.tsx · 1m10s", true);
}

/* collapsed header: summary of the current todo and agents */
function nowHead(open, cls = "") {
	return `<button class="nh" data-go="${open ? "busy" : "now"}" aria-expanded="${open}">
		<span class="lbl"><b>3/5</b> Draw the now card</span>
		<span class="meta"><span>${ic("bot")}2</span></span>
		${ic(open ? "down" : "upc")}
	</button><div class="prog"><i style="width:60%"></i></div>`;
}

function nowCard(m) {
	if (m.kbd) return "";
	if (m.s === "ask") {
		return `<div class="now wait">
			<div class="sec" style="color:var(--warn);align-items:center;padding-top:4px">Agent asks · 1 of 2<button class="later" data-go="busy">Later</button></div>
			<div class="q">Which surface should the first redesign cover?</div>
			<button class="opt"><span>Top bar<small>title and live line</small></span></button>
			<button class="opt"><span>Composer<small>steer, queue, stop</small></span></button>
			<div class="hint">Or type your own answer below.</div>
		</div>`;
	}
	if (m.s === "plan") {
		return `<div class="now wait">
			<div class="sec" style="color:var(--warn);align-items:center;padding-top:4px">Plan ready<button class="later" data-go="busy">Later</button></div>
			<div class="q">Rework session screen: 6 steps, 4 files</div>
			<button class="opt"><span>Read the plan<small>local://PLAN.md · full screen</small></span>${ic("chev")}</button>
			<div class="nact" style="padding-top:0"><button>Refine</button><button class="pri">Approve</button></div>
		</div>`;
	}
	if (m.offline) {
		return `<div class="now bad"><div class="nh" style="color:var(--err)">${ic("wifi")}<span class="lbl"><b>Offline.</b> Retry 2 in 4s</span><button class="nact" style="padding:0"><span style="display:grid;place-items:center;height:36px;padding:0 14px;border-radius:18px;border:1px solid currentColor;font-weight:700;font-size:13px">Retry now</span></button></div></div>`;
	}
	if (m.ctx >= 85) {
		return `<div class="now hot">
			${nowHead(false)}
			<div class="nb" style="border-color:var(--err-soft);background:var(--err-soft)">
				<div class="sec" style="color:var(--err)">Context 88% of 1M<span>next turn may compact</span></div>
				<div class="meter crit"><i style="width:88%"></i></div>
				<div class="nact"><button class="red">Compact</button><button>Handoff</button></div>
			</div>
		</div>`;
	}
	if (m.compact) {
		return `<div class="now"><div class="nh"><span class="spin"></span><span class="lbl"><b>Compacting</b> · 41% to about 9%</span><span class="meta">12s</span></div></div>`;
	}
	if (m.focus) {
		return `<div class="now"><div class="nh"><span class="lbl"><b>2/3</b> Edit composer.css</span><span class="meta" style="color:var(--accent)">${ic("ghost")}</span></div><div class="prog"><i style="width:66%"></i></div></div>`;
	}
	if (!m.busy) {
		return `<div class="now"><button class="nh" data-go="now"><span class="lbl" style="color:var(--muted)"><b style="color:var(--ok)">5/5 done</b> · 1 agent finished</span>${ic("upc")}</button></div>`;
	}
	if (m.s === "now") {
		return `<div class="now">${nowHead(true)}<div class="nb">
			<div class="sec">Todos<span>3 of 5</span></div>${todoList()}
			<div class="sec">Subagents<span>tap to watch</span></div>${agentList()}
		</div></div>`;
	}
	return `<div class="now">${nowHead(false)}</div>`;
}

function composer(m) {
	const busy = m.busy;
	const placeholder = m.offline
		? "Draft kept while offline…"
		: m.focus ? "Steer ComposerAudit…"
		: m.kbd ? "also check the keyboard-open case|"
		: m.s === "ask" ? "Answer in your own words…"
		: m.s === "plan" ? "Tell it what to change…"
		: busy ? (m.mode === "queue" ? "Queue a follow-up…" : "Steer the agent…")
		: "Message the agent…";
	const mode = busy
		? `<button class="mode ${m.mode}${m.compact ? " lock" : ""}">${m.mode === "queue" ? ic("queue") + "Queue" : ic("bolt") + "Steer"}</button>`
		: "";
	const stop = busy ? `<button class="rb stop" aria-label="stop">${ic("stop")}</button>` : "";
	const sendCls = ["rb", "send", m.mode === "queue" && busy ? "queue" : "", m.kbd ? "" : "off", m.offline ? "off" : ""].join(" ");
	return `<div class="cmp">
		<div class="row">
			${stop}
			<div class="field${m.kbd ? " focus" : ""}">${mode}<span class="ph${m.kbd ? " typed" : ""}">${placeholder}</span><button class="ib" aria-label="attach">${ic("clip")}</button></div>
			<button class="${sendCls}" aria-label="send">${ic("up")}</button>
		</div>
	</div>`;
}

function keyboard() {
	const r = n => `<div>${"<i></i>".repeat(n)}</div>`;
	return `<div class="kbd"><div class="acc"><span>⌃⌄</span>Done</div><div class="keys">${r(10)}${r(9)}${r(9)}<div class="wide"><i></i></div></div></div>`;
}

function page(m, extra = "") {
	return `<div class="pg">${topBar(m)}<div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column">${transcript(m)}</div>${nowCard(m)}${composer(m)}</div>`;
}

function settings(m) {
	return `<div class="scrim" data-go="busy"></div><div class="drop">
		<div class="tb"><button class="title" data-go="busy" style="padding-left:12px"><span class="t1"><span class="tx">${TITLE}</span>${ic("upc")}</span><span class="live"><span class="sdot run"></span><span>bash · bun test · 2m14s</span></span></button><button class="bk" data-go="busy" style="padding:0 12px">Done</button></div>
		<div class="body">
			<div class="grp">Model</div>
			<button class="li">${ic("cpu")}Opus 5.5<span class="v2">change${ic("chev")}</span></button>
			<div class="grp">Thinking</div>
			<div class="seg"><button>Off</button><button class="on">Low</button><button>Med</button><button>High</button><button>Max</button></div>
			<button class="li" style="margin-top:4px">${ic("plan")}Plan mode<span class="sw"></span></button>
			<div class="grp">Context<span>41% of 1M · $0.47</span></div>
			<div class="tiles">
				<button class="off">${ic("shrink")}Compact</button>
				<button class="off">${ic("hand")}Handoff</button>
				<button class="red off">${ic("trash")}Clear</button>
				<button class="red off">${ic("reset")}New session</button>
			</div>
			<div class="foot">These four wait for the turn to end.</div>
			<button class="li">${ic("eye")}Expand all tools<span class="sw"></span></button>
			<button class="li">${ic("vol")}Voice replies<span class="sw on"></span></button>
			<div class="grp">Session<span>2 subagents running</span></div>
			<div class="tiles">
				<button>${ic("pen")}Rename</button>
				<button>${ic("dollar")}Usage</button>
				<button>${ic("hub")}Agent hub</button>
				<button>${ic("info")}Details</button>
			</div>
		</div>
		<div class="grab"><i></i></div>
	</div>`;
}


function phone(s) {
	const m = model(s);
	const sb = `<div class="sb"><span>15:32</span><span>5G ▮</span></div>`;
	return sb + `<div class="track">${page(m)}</div>${m.kbd ? keyboard() : ""}${s === "settings" ? settings(m) : ""}`;
}

/* ---------- lab page ---------- */
const qs = new URLSearchParams(location.search);
const lab = document.getElementById("lab");
const intro = document.createElement("section");
intro.className = "intro";
intro.innerHTML = `
	<h1>J. Now card</h1>
	<p>One session on one page, with a "now" card above the composer that says what the session is doing.</p>
	<ul>
		<li><b>‹</b> left of the title is a plain back button to the Sessions screen, as in production.</li>
		<li><b>The now card</b> shows the current todo, progress and subagent count. Tap to open todos and subagents; tap a subagent to watch it. It becomes the question, the plan approval, the context warning or the offline notice when one of those needs you.</li>
		<li><b>Tap the title</b> and settings drop down from it: model, thinking, plan, compact, handoff, clear, new session, view toggles, rename, usage, agent hub, details.</li>
		<li><b>Keyboard up:</b> the now card hides; only the top bar, transcript and composer remain.</li>
	</ul>`;
lab.append(intro);

const sec = document.createElement("section");
sec.className = "v";
sec.id = "J";
sec.innerHTML = `<div class="cap"><b>J. Now card</b><span class="sp"></span>
	<div class="nav"><button data-step="-1" aria-label="previous state">${ic("back")}</button><button data-step="1" aria-label="next state">${ic("chev")}</button></div>
	<select aria-label="state">${STATES.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
	<div class="note">Tap the title for settings, the now card for todos and agents.</div>
	<div class="phone"></div>`;
const sel = sec.querySelector("select");
const ph = sec.querySelector(".phone");
const show = s => { sel.value = s; ph.innerHTML = phone(s); };
sel.onchange = () => show(sel.value);
sec.addEventListener("click", e => {
	const st = e.target.closest("[data-step]");
	if (st) {
		const i = STATES.findIndex(([k]) => k === sel.value);
		show(STATES[(i + Number(st.dataset.step) + STATES.length) % STATES.length][0]);
		return;
	}
	const go = e.target.closest("[data-go]");
	if (go) show(go.dataset.go);
});
show(qs.get("state") ?? "busy");
lab.append(sec);
if (qs.get("state")) requestAnimationFrame(() => sec.scrollIntoView());
</script>
</body>
</html>
