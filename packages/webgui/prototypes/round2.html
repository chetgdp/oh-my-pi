<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ompgui layout lab, round 2</title>
<style>
:root {
	--bg: oklch(0.985 0.004 307);
	--raised: #fff;
	--inset: oklch(0.95 0.006 307);
	--fg: oklch(0.26 0.03 307);
	--muted: oklch(0.46 0.03 307);
	--faint: oklch(0.58 0.025 307);
	--accent: oklch(0.62 0.23 341);
	--accent-soft: oklch(0.62 0.23 341 / 12%);
	--ok: oklch(0.55 0.13 150);
	--warn: oklch(0.62 0.14 70);
	--warn-soft: oklch(0.75 0.14 80 / 18%);
	--err: oklch(0.55 0.19 25);
	--err-soft: oklch(0.55 0.19 25 / 10%);
	--border: oklch(0 0 0 / 10%);
	--border-strong: oklch(0 0 0 / 16%);
	--backdrop: oklch(0.4 0.02 307 / 30%);
	--bubble: #007aff;
	--hit: 44px;
	--ui: "Atkinson Hyperlegible Next", -apple-system, system-ui, sans-serif;
	--mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--ui); -webkit-text-size-adjust: 100%; }
button, select { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- lab chrome ---------- */
.lab { height: 100svh; overflow-y: auto; scroll-snap-type: y mandatory; }
.lab > section { scroll-snap-align: start; min-height: 100svh; }
.intro { padding: calc(env(safe-area-inset-top) + 20px) 20px 28px; max-width: 760px; }
.intro h1 { font-size: 22px; margin: 0 0 6px; }
.intro h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 22px 0 6px; }
.intro p, .intro li { color: var(--muted); }
.intro ol, .intro ul { padding-left: 20px; margin: 4px 0; }
.intro li { margin: 5px 0; }
.intro b { color: var(--fg); }
.intro a { color: var(--accent); }
.intro table { border-collapse: collapse; font-size: 13px; width: 100%; }
.intro td, .intro th { border-bottom: 1px solid var(--border); padding: 6px 4px; text-align: left; vertical-align: top; color: var(--muted); }
.intro th { color: var(--fg); }
.v { display: flex; flex-direction: column; height: 100svh; }
.cap { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--inset); border-bottom: 1px solid var(--border); font-size: 13px; }
.cap b { font-size: 14px; white-space: nowrap; }
.cap select { min-width: 0; flex: 1; max-width: 190px; }
.cap .sp { flex: 1; }
.cap select { border: 1px solid var(--border-strong); border-radius: 8px; padding: 4px 8px; background: var(--raised); font-size: 13px; }
.cap .nav { display: flex; gap: 4px; }
.cap .nav button { width: 30px; height: 30px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--raised); display: grid; place-items: center; }
.cap .nav svg { width: 16px; height: 16px; }
.note { flex: none; padding: 6px 12px; font-size: 12px; color: var(--accent); background: var(--inset); border-bottom: 1px solid var(--border); }
.lab.nonotes .note { display: none; }
@media (min-width: 760px) {
	.lab { scroll-snap-type: none; display: flex; flex-wrap: wrap; gap: 32px; padding: 24px; justify-content: center; align-items: flex-start; }
	.lab > section { min-height: 0; }
	.intro { width: 100%; padding: 0; }
	.v { height: auto; width: 377px; }
	.cap, .note { background: none; border: 0; padding: 0 2px 8px; }
	.phone { flex: none !important; height: 812px; border: 1px solid var(--border-strong); border-radius: 40px; overflow: hidden; box-shadow: 0 12px 32px oklch(0 0 0 / 12%); }
}

/* ---------- phone ---------- */
.phone { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
.sb { flex: none; height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-weight: 600; }
@media (max-width: 759px) { .sb { display: none; } }

/* top bar */
.tb { flex: none; display: flex; align-items: center; gap: 2px; height: 56px; padding: 0 6px 0 2px; background: var(--raised); border-bottom: 1px solid var(--border); }
.ib { position: relative; width: var(--hit); height: var(--hit); display: grid; place-items: center; border-radius: 12px; color: var(--muted); flex: none; }
.ib:active { background: var(--inset); }
.back { flex: none; height: var(--hit); display: flex; align-items: center; gap: 0; padding: 0 4px 0 2px; border-radius: 12px; color: var(--muted); }
.back:active { background: var(--inset); }
.cnt { min-width: 18px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--faint); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.cnt.wait { background: var(--warn); }
.title { flex: 1; min-width: 0; height: var(--hit); display: flex; flex-direction: column; justify-content: center; text-align: left; padding: 0 4px; border-radius: 10px; }
.title:active { background: var(--inset); }
.t1 { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; min-width: 0; }
.t1 .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t1 svg { width: 14px; height: 14px; color: var(--faint); }
.live { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; min-width: 0; }
.live .sep { color: var(--faint); }
.live.wait { color: var(--warn); font-weight: 700; }
.live.bad { color: var(--err); font-weight: 700; }
.live.ghost { color: var(--accent); font-weight: 700; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.sdot.run { background: var(--accent); animation: pulse 1.2s infinite; }
.sdot.wait { background: var(--warn); }
.sdot.bad { background: var(--err); }
.sdot.compacting { background: var(--warn); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.n-hot { color: var(--warn); font-weight: 700; }
.n-crit { color: var(--err); font-weight: 700; }

/* pills: tappable status. Visual 32px, hit 44px. */
.pill { position: relative; flex: none; display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px; border-radius: 16px; border: 1px solid var(--border-strong); background: var(--raised); font-size: 13px; font-weight: 700; color: var(--fg); white-space: nowrap; }
.pill::after { content: ""; position: absolute; inset: -6px -2px; }
.pill svg { width: 15px; height: 15px; color: var(--muted); }
.pill.dim { color: var(--faint); font-weight: 400; }
.pill.hot { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.pill.crit { border-color: var(--err); background: var(--err-soft); color: var(--err); }

/* banners (one slot under the top bar) */
.ban { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 0 14px; font-size: 14px; border-bottom: 1px solid var(--border); }
.ban .grow { flex: 1; }
.ban.bad { background: var(--err-soft); color: var(--err); }
.ban.ghost { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.ban .act { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid currentColor; font-size: 13px; font-weight: 700; }

/* transcript */
.tr { flex: 1; min-height: 0; overflow: hidden; padding: 14px 14px 10px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
.bub { align-self: flex-end; max-width: 82%; background: var(--bubble); color: #fff; padding: 9px 14px; border-radius: 18px; }
.bub.q { background: var(--inset); color: var(--muted); border: 1px dashed var(--border-strong); display: flex; gap: 8px; align-items: center; }
.bub.q small { display: block; font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }
.bub.q svg { width: 16px; height: 16px; }
.mark { align-self: center; font-size: 12px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.mark svg { width: 14px; height: 14px; }
.at { color: var(--fg); }
.at code { font-family: var(--mono); font-size: 13px; background: var(--inset); padding: 1px 4px; border-radius: 3px; }
.tool { border: 1px solid var(--border-strong); border-radius: 12px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.tool b { color: var(--fg); }
.tool .el { margin-left: auto; font-family: var(--ui); color: var(--faint); font-size: 12px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: rot 1s linear infinite; flex: none; }
.ok-ic { color: var(--ok); width: 14px; height: 14px; }
@keyframes rot { to { transform: rotate(1turn); } }
.jump { position: absolute; right: 14px; width: 40px; height: 40px; border-radius: 20px; background: var(--raised); border: 1px solid var(--border-strong); display: grid; place-items: center; box-shadow: 0 4px 12px oklch(0 0 0 / 10%); z-index: 2; }

/* index line (concept G) */
.idx { flex: none; display: flex; align-items: stretch; height: 40px; margin: 0 10px 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--raised); overflow: hidden; }
.idx button { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; color: var(--muted); border-left: 1px solid var(--border); white-space: nowrap; padding: 0 6px; }
.idx button:first-child { border-left: 0; flex-grow: 2; color: var(--fg); font-weight: 700; }
.idx svg { width: 14px; height: 14px; }
.idx .n-hot { color: var(--warn); }
.idx .n-crit { color: var(--err); }

/* nudge row (same slot in every concept) */
.nudge { flex: none; margin: 0 10px 8px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: 12px; font-size: 14px; }
.nudge.hot { background: var(--err-soft); color: var(--err); }
.nudge .grow { flex: 1; }
.nudge button { height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; font-weight: 700; border: 1px solid currentColor; }
.nudge button.solid { background: var(--err); border-color: var(--err); color: #fff; }

/* composer */
.cmp { flex: none; padding: 8px 10px 10px; background: var(--raised); border-top: 1px solid var(--border); }
.row { display: flex; align-items: flex-end; gap: 8px; }
.field { flex: 1; min-width: 0; min-height: var(--hit); display: flex; align-items: center; gap: 4px; border: 1px solid var(--border-strong); border-radius: 22px; background: var(--inset); padding: 0 4px 0 6px; }
.field.focus { border-color: var(--accent); background: var(--raised); }
.field .ph { flex: 1; min-width: 0; padding: 11px 6px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .ph.typed { color: var(--fg); }
.field .ib { width: 36px; height: 36px; }
.mode { flex: none; height: 32px; padding: 0 10px; border-radius: 16px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.mode.steer { background: var(--accent-soft); color: var(--accent); }
.mode.queue { background: var(--inset); color: var(--fg); border: 1px solid var(--border-strong); }
.mode.lock { opacity: .7; }
.mode svg { width: 14px; height: 14px; }
.rb { flex: none; width: var(--hit); height: var(--hit); border-radius: 22px; display: grid; place-items: center; }
.rb.send { background: var(--accent); color: #fff; }
.rb.send.queue { background: var(--fg); }
.rb.send.off { opacity: .35; }
.rb.stop { background: var(--err-soft); color: var(--err); border: 1.5px solid var(--err); }
.rb.stop svg { fill: currentColor; stroke: none; width: 14px; height: 14px; }
.rb.stop.off { opacity: .35; }

/* dock (concept F) */
.dock { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); height: 52px; background: var(--raised); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.dock button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; color: var(--muted); position: relative; }
.dock button b { font-size: 13px; color: var(--fg); }
.dock button svg { width: 18px; height: 18px; }
.dock .hot b { color: var(--err); }
.dock .wait { color: var(--warn); }
.dock .wait b { color: var(--warn); }
.dock .dotw { position: absolute; top: 7px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

/* needs-you card, replaces the composer */
.card { flex: none; background: var(--raised); border-top: 2px solid var(--warn); padding: 12px 12px 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -8px 20px oklch(0 0 0 / 6%); }
.card .kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); display: flex; gap: 6px; align-items: center; }
.card .kind .sp { flex: 1; }
.card .kind button { color: var(--faint); font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.card .q { font-weight: 700; }
.opt { display: flex; align-items: center; gap: 10px; min-height: var(--hit); padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 12px; text-align: left; }
.opt small { color: var(--faint); display: block; font-size: 12px; }
.acts { display: flex; gap: 8px; }
.acts button { flex: 1; height: var(--hit); border-radius: 12px; font-weight: 700; border: 1px solid var(--border-strong); }
.acts .pri { background: var(--accent); color: #fff; border-color: transparent; }

/* keyboard mock */
.kbd { flex: none; height: 336px; background: #d1d3d9; display: flex; flex-direction: column; }
.kbd .acc { height: 45px; background: #f2f2f4; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; color: #1a7cf5; font-weight: 600; border-bottom: 1px solid #c8c8cc; }
.kbd .acc span { color: #b0b0b5; letter-spacing: 8px; }
.kbd .keys { flex: 1; display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 10px 4px 36px; }
.kbd .keys div { display: flex; gap: 6px; justify-content: center; }
.kbd .keys i { flex: 0 0 31px; background: #fff; border-radius: 5px; box-shadow: 0 1px 0 #898a8d; }
.kbd .keys .wide i { flex: 0 0 auto; width: 190px; }

/* sheets */
.scrim { position: absolute; inset: 0; background: var(--backdrop); z-index: 8; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--raised); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 28px oklch(0 0 0 / 16%); max-height: 86%; display: flex; flex-direction: column; }
.sheet.med { max-height: 62%; }
.sh-top { flex: none; display: flex; align-items: center; padding: 8px 8px 4px 20px; }
.sh-top .grab { position: absolute; left: 50%; top: 6px; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--border-strong); }
.sh-top h3 { flex: 1; margin: 10px 0 0; font-size: 17px; }
.sh-top .done { height: var(--hit); padding: 0 12px; color: var(--accent); font-weight: 700; margin-top: 6px; }
.sh-body { overflow-y: auto; padding-bottom: 20px; }
.grp { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 14px 20px 4px; }
.li { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 20px; width: 100%; text-align: left; }
.li:active { background: var(--inset); }
.li > svg { color: var(--muted); }
.li .v2 { margin-left: auto; color: var(--faint); font-size: 14px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.li .v2 svg { width: 16px; height: 16px; }
.li.red, .li.red > svg { color: var(--err); }
.li.off { opacity: .45; }
.li .sub { display: block; color: var(--faint); font-size: 12px; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--border-strong); position: relative; margin-left: auto; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px oklch(0 0 0 / 25%); }
.sw.on { background: var(--ok); }
.sw.on::after { left: 21px; }
.meter { margin: 4px 20px 6px; height: 8px; border-radius: 4px; background: var(--inset); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.crit i { background: var(--err); }
.foot { font-size: 12px; color: var(--faint); padding: 4px 20px; }
.srow { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 20px; width: 100%; text-align: left; border-bottom: 1px solid var(--border); }
.srow .nm { font-weight: 700; display: block; }
.srow .st { font-size: 13px; color: var(--muted); display: block; }
.srow .st.wait { color: var(--warn); font-weight: 700; }
.srow.cur { background: var(--inset); }
.todo { display: flex; gap: 12px; align-items: flex-start; padding: 10px 20px; }
.todo .bx { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-strong); flex: none; display: grid; place-items: center; margin-top: 1px; }
.todo.done .bx { background: var(--ok); border-color: var(--ok); color: #fff; }
.todo.done .bx svg { width: 14px; height: 14px; }
.todo.cur .bx { border-color: var(--accent); }
.todo.cur { background: var(--accent-soft); }
.todo.done span { color: var(--faint); text-decoration: line-through; }
</style>
</head>
<body>
<div class="lab" id="lab"></div>
<script>
const I = {
	back: '<path d="M15 18l-6-6 6-6"/>',
	chev: '<path d="M9 6l6 6-6 6"/>',
	down: '<path d="M6 9l6 6 6-6"/>',
	up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
	arrowDown: '<path d="M12 5v14M5 12l7 7 7-7"/>',
	stop: '<rect x="5" y="5" width="14" height="14" rx="2"/>',
	clip: '<path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/>',
	todo: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
	bot: '<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9.5 13h0M14.5 13h0"/>',
	stack: '<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/>',
	gauge: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="M12 18l4-5"/>',
	more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
	x: '<path d="M6 6l12 12M18 6L6 18"/>',
	clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
	cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
	plan: '<path d="M4 6h16M4 12h10M4 18h6"/>',
	shrink: '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',
	hand: '<path d="M5 12h14M13 6l6 6-6 6"/>',
	eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
	vol: '<path d="M11 5L6 9H2v6h4l5 4zM16 9a5 5 0 0 1 0 6"/>',
	pen: '<path d="M17 3l4 4L7 21H3v-4z"/>',
	info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h0"/>',
	dollar: '<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
	wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0M12 20h0"/>',
	trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
	reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
	plus: '<path d="M12 5v14M5 12h14"/>',
	hub: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>',
	ghost: '<path d="M5 21V10a7 7 0 0 1 14 0v11l-3-2-2 2-2-2-2 2-2-2z"/><path d="M9.5 10h0M14.5 10h0"/>',
	queue: '<path d="M4 6h16M4 12h16M4 18h9"/>',
	bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
	check: '<path d="M5 12l5 5L20 7"/>',
};
const ic = (n, extra = "") => `<svg viewBox="0 0 24 24" ${extra}>${I[n]}</svg>`;

const STATES = [
	["idle", "Idle"],
	["busy", "Streaming"],
	["typing", "Streaming, keyboard up, queueing"],
	["ask", "Needs you: ask"],
	["plan", "Needs you: plan approval"],
	["hot", "Context 88%"],
	["compact", "Compacting"],
	["offline", "Disconnected"],
	["focus", "Focused subagent"],
	["s-session", "Sheet: session"],
	["s-sessions", "Sheet: sessions (‹)"],
	["s-todos", "Sheet: todos"],
	["s-agents", "Sheet: agents"],
];

const CONCEPTS = {
	E: {
		name: "E. Live header",
		note: "Status lives up top: title, live line, and two pills. The bottom stays just the composer, which gives the transcript the most room with the keyboard up.",
	},
	F: {
		name: "F. Dock",
		note: "Status lives in a fixed 5-slot dock under the composer, in thumb reach. The dock hides while the keyboard is up; the top bar shows only identity and live state.",
	},
	G: {
		name: "G. Index line",
		note: "Status lives in one read-only index line above the composer; each segment opens its sheet. The line hides while the keyboard is up. The top bar shows identity and live state.",
	},
};

/* ---------- state model ---------- */
function model(s) {
	const busy = ["busy", "typing", "compact", "focus", "s-agents", "s-todos"].includes(s);
	return {
		s,
		busy,
		wait: s === "ask" || s === "plan",
		kbd: s === "typing",
		offline: s === "offline",
		focus: s === "focus",
		compact: s === "compact",
		ctx: s === "hot" ? 88 : 41,
		sheet: s.startsWith("s-") ? s.slice(2) : null,
		mode: s === "typing" || s === "compact" ? "queue" : "steer",
	};
}
const ctxClass = n => (n >= 85 ? "n-crit" : n >= 70 ? "n-hot" : "");

function liveParts(m) {
	if (m.wait) return { cls: "wait", dot: "wait", text: m.s === "plan" ? "needs you · plan · 1m" : "needs you · question · 1m" };
	if (m.offline) return { cls: "bad", dot: "bad", text: "disconnected · retrying" };
	if (m.focus) return { cls: "ghost", dot: "run", text: "subagent · edit · 40s" };
	if (m.compact) return { cls: "", dot: "compacting", text: "compacting · 12s" };
	if (m.busy) return { cls: "", dot: "run", text: "bash · 2m14s" };
	return { cls: "", dot: "", text: "idle · 3m" };
}

/* ---------- shared components ---------- */
function topBar(c, m) {
	const lp = liveParts(m);
	const nums = c === "E" && !m.offline ? `<span class="sep">·</span><span class="${ctxClass(m.ctx)}">${m.ctx}%</span><span class="sep">·</span><span>$0.47</span>` : "";
	const title = m.focus ? "👻 ComposerAudit" : "🖥️ WEBGUI: Review webgui package context";
	const pills = c === "E"
		? `<button class="pill${m.focus ? " dim" : ""}" data-go="s-todos">${ic("todo")}3/7</button><button class="pill" data-go="s-agents">${ic("bot")}2</button>`
		: "";
	return `<div class="tb">
		<button class="back" data-go="s-sessions" aria-label="sessions">${ic("back")}${c === "F" ? "" : '<span class="cnt wait">3</span>'}</button>
		<button class="title" data-go="s-session">
			<span class="t1"><span class="tx">${title}</span>${ic("down")}</span>
			<span class="live ${lp.cls}"><span class="sdot ${lp.dot}"></span><span>${lp.text}</span>${nums}</span>
		</button>
		${pills}
	</div>`;
}

function banner(m) {
	if (m.offline) return `<div class="ban bad">${ic("wifi")}<span class="grow">Reconnecting · attempt 2</span><button class="act">Retry</button></div>`;
	if (m.focus) return `<div class="ban ghost">${ic("ghost")}<span class="grow">Viewing subagent ComposerAudit</span><button class="act">‹ Main</button></div>`;
	return "";
}

function transcript(m) {
	if (m.focus) {
		return `<div class="tr">
			<div class="at">Reading <code>Composer.tsx</code> to map the busy-state controls.</div>
			<div class="tool">${ic("check", 'class="ok-ic"')}<b>read</b> Composer.tsx:380-440</div>
			<div class="tool"><span class="spin"></span><b>edit</b> composer.css<span class="el">40s</span></div>
		</div>`;
	}
	const running = m.busy && !m.compact;
	let tail = "";
	if (m.s === "typing") tail = "";
	if (m.busy && !m.compact) tail += `<div class="bub q">${ic("clock")}<span><small>Queued · sends after this turn</small>Run the webgui tests</span>${ic("x")}</div>`;
	if (m.compact) tail += `<div class="mark"><span class="spin"></span>Compacting context · new messages will queue</div>`;
	return `<div class="tr">
		<div class="bub">Retool the prototypes</div>
		<div class="at">Reading the three critiques, then rebuilding around one shared component set.</div>
		<div class="tool">${ic("check", 'class="ok-ic"')}<b>read</b> critique-CritiqueSystem.md</div>
		${m.busy || m.compact ? `<div class="mark">${ic("bolt")}Steer delivered at tool boundary</div>` : ""}
		<div class="tool">${running ? '<span class="spin"></span>' : ic("check", 'class="ok-ic"')}<b>bash</b> bun test<span class="el">${running ? "2m14s" : "2m40s"}</span></div>
		${tail}
	</div>`;
}

function nudge(m) {
	if (m.ctx >= 85 && !m.wait) return `<div class="nudge hot"><span class="grow"><b>Context 88%</b> · next turn may compact</span><button class="solid">Compact</button><button>Handoff</button></div>`;
	return "";
}

function composer(m) {
	if (m.s === "ask") {
		return `<div class="card">
			<div class="kind">${ic("info")}<span>Agent asks · 1 of 2</span><span class="sp"></span><button data-go="idle">Later</button></div>
			<div class="q">Which surface should the first redesign cover?</div>
			<button class="opt"><span>Top bar<small>title, live line, pills</small></span></button>
			<button class="opt"><span>Composer<small>steer / queue / stop</small></span></button>
			<button class="opt"><span>Reply in your own words…</span></button>
		</div>`;
	}
	if (m.s === "plan") {
		return `<div class="card">
			<div class="kind">${ic("plan")}<span>Plan ready</span><span class="sp"></span><button data-go="idle">Later</button></div>
			<div class="q">Rework session screen: 6 steps, 4 files</div>
			<button class="opt"><span>Read the plan<small>local://PLAN.md · opens full screen</small></span>${ic("chev")}</button>
			<div class="acts"><button>Refine</button><button class="pri">Approve</button></div>
		</div>`;
	}
	const busy = m.busy;
	const placeholder = m.offline
		? "Draft kept while offline…"
		: m.focus
			? "Steer ComposerAudit…"
			: m.kbd
				? "also check the keyboard-open case|"
				: busy
					? m.mode === "queue" ? "Queue a follow-up…" : "Steer the agent…"
					: "Message the agent…";
	const mode = busy
		? `<button class="mode ${m.mode}${m.compact ? " lock" : ""}">${m.mode === "queue" ? ic("queue") + "Queue" : ic("bolt") + "Steer"}</button>`
		: "";
	const stop = busy ? `<button class="rb stop" aria-label="stop">${ic("stop")}</button>` : "";
	const sendCls = ["rb", "send", m.mode === "queue" && busy ? "queue" : "", m.kbd ? "" : "off", m.offline ? "off" : ""].join(" ");
	return `<div class="cmp">
		<div class="row">
			${stop}
			<div class="field${m.kbd ? " focus" : ""}">${mode}<span class="ph${m.kbd ? " typed" : ""}">${placeholder}</span><button class="ib" aria-label="attach">${ic("clip")}</button></div>
			<button class="${sendCls}" aria-label="send">${ic("up")}</button>
		</div>
	</div>`;
}

function indexLine(m) {
	return `<div class="idx">
		<button data-go="s-session">Opus 5.5 · low</button>
		<button data-go="s-todos">${ic("todo")}3/7</button>
		<button data-go="s-agents">${ic("bot")}2</button>
		<button data-go="s-session" class="${ctxClass(m.ctx)}">${m.ctx}%</button>
		<button data-go="s-session">$0.47</button>
	</div>`;
}

function dock(m) {
	return `<div class="dock">
		<button data-go="s-sessions" class="wait"><span class="dotw"></span>${ic("stack")}<b>3</b>sessions</button>
		<button data-go="s-todos">${ic("todo")}<b>3/7</b>todos</button>
		<button data-go="s-agents">${ic("bot")}<b>2</b>agents</button>
		<button data-go="s-session" class="${m.ctx >= 85 ? "hot" : ""}">${ic("gauge")}<b>${m.ctx}%</b>context</button>
		<button data-go="s-session">${ic("more")}<b>&nbsp;</b>more</button>
	</div>`;
}

function keyboard() {
	const r = n => `<div>${"<i></i>".repeat(n)}</div>`;
	return `<div class="kbd"><div class="acc"><span>⌃⌄</span>Done</div><div class="keys">${r(10)}${r(9)}${r(9)}<div class="wide"><i></i></div></div></div>`;
}

/* ---------- sheets (shared by all concepts) ---------- */
function sheetWrap(title, body, med) {
	return `<div class="scrim" data-go="idle"></div><div class="sheet${med ? " med" : ""}"><div class="sh-top"><span class="grab"></span><h3>${title}</h3><button class="done" data-go="idle">Done</button></div><div class="sh-body">${body}</div></div>`;
}
function sheetSession(m) {
	const lock = m.busy ? " off" : "";
	return sheetWrap("🖥️ WEBGUI: Review webgui…", `
		<div class="grp">Run</div>
		<button class="li">${ic("cpu")}Model<span class="v2">Opus 5.5 · low${ic("chev")}</span></button>
		<button class="li">${ic("plan")}Plan mode<span class="sw"></span></button>
		<div class="grp">Context · ${m.ctx}% of 1M · $0.47</div>
		<div class="meter${m.ctx >= 85 ? " crit" : ""}"><i style="width:${m.ctx}%"></i></div>
		<button class="li${lock}">${ic("shrink")}Compact<span class="v2">${m.busy ? "after this turn" : ""}</span></button>
		<button class="li${lock}">${ic("hand")}Handoff</button>
		<button class="li">${ic("dollar")}Usage<span class="v2">${ic("chev")}</span></button>
		<div class="grp">View</div>
		<button class="li">${ic("eye")}Expand all tools<span class="sw"></span></button>
		<button class="li">${ic("vol")}Voice<span class="sw on"></span></button>
		<div class="grp">Session</div>
		<button class="li">${ic("pen")}Rename</button>
		<button class="li">${ic("info")}Details<span class="v2">ids, file, tokens${ic("chev")}</span></button>
		<button class="li">${ic("wifi")}Connection<span class="v2">${m.offline ? "retrying" : "connected · ws"}</span></button>
		<div class="grp">Danger</div>
		<button class="li red${lock}">${ic("trash")}Clear context</button>
		<button class="li red${lock}">${ic("reset")}Reset session<span class="v2" style="color:var(--faint)">fresh start, same folder</span></button>
		${m.busy ? '<div class="foot">Context actions wait for the turn to end. Everything else works now.</div>' : ""}
	`);
}
function sheetSessions() {
	const row = (nm, st, cls = "", cur = "") => `<button class="srow ${cur}"><span class="sdot ${cls}"></span><span style="flex:1;min-width:0"><span class="nm">${nm}</span><span class="st ${cls === "wait" ? "wait" : ""}">${st}</span></span>${ic("chev")}</button>`;
	return sheetWrap("Sessions", `
		${row("🔈 WREN: character voices", "waiting on you · asked 4m ago", "wait")}
		${row("🖥️ WEBGUI: Review webgui package", "bash · 2m14s · 41%", "run", "cur")}
		${row("🍯 MELE: gamepad input", "edit · 30s · 63%", "run")}
		${row("📄 RESUME: text density", "idle · 21h", "")}
		<button class="li">${ic("plus")}New session<span class="v2">pick a folder${ic("chev")}</span></button>
		<button class="li">${ic("clock")}Past sessions<span class="v2">${ic("chev")}</span></button>
	`);
}
function sheetTodos() {
	const t = (txt, cls) => `<div class="todo ${cls}"><span class="bx">${cls === "done" ? ic("check") : ""}</span><span>${txt}</span></div>`;
	return sheetWrap("Todos · 3 of 7", `
		${t("Read the three critiques", "done")}
		${t("Pick one component vocabulary", "done")}
		${t("Map every control to one home", "done")}
		${t("Build E, F, G on shared components", "cur")}
		${t("Draw keyboard-open and needs-you states", "")}
		${t("Verify at 375×812", "")}
		${t("Report back", "")}
	`, true);
}
function sheetAgents() {
	const a = (nm, meta, run) => `<button class="srow"><span class="sdot ${run ? "run" : ""}"></span><span style="flex:1;min-width:0"><span class="nm">${nm}</span><span class="st">${meta}</span></span>${ic("chev")}</button>`;
	return sheetWrap("Agents · 2 running", `
		${a("ComposerAudit", "task · edit composer.css · 40s", true)}
		${a("TopBarAudit", "scout · read TopBar.tsx · 1m10s", true)}
		${a("UiInventory", "scout · done · 2m23s", false)}
		<button class="li">${ic("hub")}Open agent hub<span class="v2">${ic("chev")}</span></button>
		<button class="li">${ic("x")}Clear finished</button>
	`, true);
}

/* ---------- concept assembly ---------- */
function phone(c, s) {
	const m = model(s);
	const base = m.sheet ? model(m.sheet === "session" ? "busy" : "busy") : m;
	const v = m.sheet ? { ...base, sheet: m.sheet } : m;
	const showIdx = c === "G" && !v.kbd && !v.wait;
	const showDock = c === "F" && !v.kbd;
	let sheet = "";
	if (m.sheet === "session") sheet = sheetSession(v);
	if (m.sheet === "sessions") sheet = sheetSessions();
	if (m.sheet === "todos") sheet = sheetTodos();
	if (m.sheet === "agents") sheet = sheetAgents();
	return `<div class="sb"><span>15:32</span><span>5G ▮</span></div>
		${topBar(c, v)}
		${banner(v)}
		${transcript(v)}
		${nudge(v)}
		${showIdx ? indexLine(v) : ""}
		${composer(v)}
		${showDock ? dock(v) : ""}
		${v.kbd ? keyboard() : ""}
		${sheet}`;
}

/* ---------- lab page ---------- */
const qs = new URLSearchParams(location.search);
const lab = document.getElementById("lab");
const intro = document.createElement("section");
intro.className = "intro";
intro.innerHTML = `
	<h1>Layout lab, round 2</h1>
	<p>Static, nothing wired. Swipe up for each concept; the menu in each caption steps through 13 states. Tap a pill, slot, the title or ‹ to open its sheet. Round 1 is at <a href="round1.html">round1.html</a>.</p>
	<h2>Shared system (all three concepts)</h2>
	<ul>
		<li><b>State first.</b> The top bar always shows the title and one live line: what it is doing and for how long (<i>bash · 2m14s</i>, <i>waiting on you · 1m</i>, <i>disconnected</i>).</li>
		<li><b>Waiting on you takes over the composer.</b> Asks and plan approval become a card in the composer slot, not a modal you can lose. "Later" brings the composer back and leaves the live line amber.</li>
		<li><b>Stop never shares a pixel with Send.</b> While busy, ■ sits at the far left and ↑ at the far right. The mode chip in the field toggles Steer / Queue with one tap; ↑ turns dark for Queue.</li>
		<li><b>Queued and steered messages are visible</b> in the transcript (dashed bubble with ✕, "steer delivered" marker).</li>
		<li><b>Numbers escalate.</b> Context is neutral below 70%, amber to 85%, then red with a Compact / Handoff nudge in a fixed slot above the composer.</li>
		<li><b>‹ is the session switcher</b>, with a count that turns amber when another session waits on you. All sessions, New and Past live in that sheet.</li>
		<li><b>One home per action:</b> the Session sheet (title tap), grouped Run / Context / View / Session / Danger. Only context actions wait for the turn; Usage, View and the rest stay usable mid-stream. "New session" on the ⋮ menu is renamed <b>Reset session</b>.</li>
		<li><b>One vocabulary:</b> 44pt hit areas, bottom sheets with Done, pills for tappable status, plain text for read-only values, line icons only. No popovers.</li>
	</ul>
	<h2>What differs: where live status lives</h2>
	<table>
		<tr><th></th><th>Status home</th><th>Keyboard up</th><th>Trade-off</th></tr>
		<tr><td><a href="#E">E</a></td><td>top bar: live line with ctx and cost, todo and agent pills</td><td>top bar + 1 row</td><td>most transcript; pills sit in the hard-to-reach band</td></tr>
		<tr><td><a href="#F">F</a></td><td>5-slot dock under the composer</td><td>dock hides</td><td>everything in thumb reach; +52pt when the keyboard is down</td></tr>
		<tr><td><a href="#G">G</a></td><td>read-only index line above the composer</td><td>line hides</td><td>quiet and compact; segments are smaller targets than the dock</td></tr>
	</table>
	<p><button class="pill" id="noteToggle">Hide notes</button></p>`;
lab.append(intro);

for (const c of Object.keys(CONCEPTS)) {
	const sec = document.createElement("section");
	sec.className = "v";
	sec.id = c;
	sec.innerHTML = `<div class="cap"><b>${CONCEPTS[c].name}</b><span class="sp" style="flex:0 0 0"></span>
		<div class="nav"><button data-step="-1" aria-label="previous state">${ic("back")}</button><button data-step="1" aria-label="next state">${ic("chev")}</button></div>
		<select aria-label="state">${STATES.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
		<div class="note">${CONCEPTS[c].note}</div>
		<div class="phone"></div>`;
	const sel = sec.querySelector("select");
	const ph = sec.querySelector(".phone");
	const show = s => { sel.value = s; ph.innerHTML = phone(c, s); };
	sel.onchange = () => show(sel.value);
	sec.addEventListener("click", e => {
		const st = e.target.closest("[data-step]");
		if (st) {
			const i = STATES.findIndex(([k]) => k === sel.value);
			show(STATES[(i + Number(st.dataset.step) + STATES.length) % STATES.length][0]);
			return;
		}
		const go = e.target.closest("[data-go]");
		if (go) show(go.dataset.go);
	});
	show(qs.get("state") ?? "busy");
	lab.append(sec);
}
document.getElementById("noteToggle").onclick = e => {
	lab.classList.toggle("nonotes");
	e.target.textContent = lab.classList.contains("nonotes") ? "Show notes" : "Hide notes";
};
const only = qs.get("only");
if (only) for (const s of lab.querySelectorAll("section")) if (s.id !== only) s.remove();
</script>
</body>
