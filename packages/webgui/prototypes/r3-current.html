.lab { min-height: 100svh; display: flex; justify-content: center; align-items: flex-start; padding: 16px; box-sizing: border-box; background: #eee; }

.kbd .keys { flex: 1; display: grid; grid-template-rows: repeat(4, 1fr); gap: 10px; padding: 10px 4px 36px; }

</style>
</head>

div class=\"md-row-main\"><span class=\"md-row-name\">Thinking</span><span class=\"md-row-id\">slow</span><button type=\"button\" class=\"md-tag-chip md-tag-chip--add\" title=\"Add tag\">+ tag</button></div><div class=\"md-row-detail\"><span class=\"md-row-model\">Claude Fable 5.1 (auto)</span><span class=\"md-badge md-badge--global\">global</span></div></div><div class=\"md-row md-role-row\" role=\"button\" tabindex=\"0\"><div class=\"md-row-main\"><span class=\"md-row-name\">Vision</span><span class=\"md-row-id\">vision</span><button type=\"button\" class=\"md-tag-chip md-tag-chip--add\" title=\"Add tag\">+ tag</button></div><div class=\"md-row-detail\"><span class=\"md-row-model md-row-unset\">unset</span></div></div><div class=\"md-row md-role-row\" role=\"button\" tabindex=\"0\"><div class=\"md-row-main\"><span class=\"md-row-name\">Architect</span><span class=\"md-row-id\">plan</span><button type=\"button\" class=\"md-tag-chip md-tag-chip--add\" title=\"Add tag\">+ tag</button></div><div class=\"md-row-detail\"><span class=\"md-row-model\">Claude Opus 5.5 (auto)</span><span class=\"md-badge md-badge--global\">global</span></div></div><div class=\"md-row md-role-row\" role=\"button\" tabindex=\"0\"><div class=\"md-row-main\"><span class=\"md-row-name\">Commit</span><span class=\"md-row-id\">commit</span><button type=\"button\" class=\"md-tag-chip md-tag-chip--add\" title=\"Add tag\">+ tag</button></div><div class=\"md-row-detail\"><span class=\"md-row-model md-row-unset\">unset</span></div></div><div class=\"md-row md-role-row\" role=\"button\" tabindex=\"0\"><div class=\"md-row-main\"><span class=\"md-row-name\">Tiny</span><span class=\"md-row-id\">tiny</span><button type=\"button\" class=\"md-tag-chip md-tag-chip--add\" title=\"Add tag\">+ tag</button></div><div class=\"md-row-detail\"><span class=\"md-row-model md-row-unset\">unset</span><span class=\"md-badge md-badge--global\">global</span></div></div><div class=\"md-row md-role-row\" role=\"button\" tabindex=\"0\"><div class=\"md-row-main\"><span class=\"md-row-name\">Memory</span><span class=\"md-row-id\">memory</span><button type=\"button\" class=\"md-tag-chip md-tag-chip--add\" title=\"Add tag\">+ tag</button></div><div class=\"md-row-detail\"><span class=\"md-row-model md-row-unset\">unset</span></div></div><div class=\"md-row md-role-row\" role=\"button\" tabindex=\"0\"><div class=\"md-row-main\"><span class=\"md-row-name\">Subtask</span><span class=\"md-row-id\">task</span><button type=\"button\" class=\"md-tag-chip md-tag-chip--add\" title=\"Add tag\">+ tag</button></div><div class=\"md-row-detail\"><span class=\"md-row-model\">Claude Opus 5.5 (auto)</span><span class=\"md-badge md-badge--global\">global</span></div></div></div><div class=\"md-roles-footer\"><button type=\"button\" class=\"md-new-role-btn\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-plus\" aria-hidden=\"true\"><path d=\"M5 12h14\"></path><path d=\"M12 5v14\"></path></svg><span>New role</span></button></div><div class=\"md-cycle-editor\"><button type=\"button\" class=\"md-cycle-toggle\" aria-expanded=\"false\"><span class=\"md-cycle-title\">Quick-switch cycle</span><span class=\"md-cycle-count\">(4)</span><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-down\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"></path></svg></button></div></section></div></section></div></div></div>";
const STATES = ["idle", "busy", "typing", "ask", "plan", "hot", "compact", "offline", "focus", "settings"];
const icon = n => ICONS[n];
const X_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>';
const TITLE = "🖥️ WEBGUI: Review webgui package context";
const FOCUS_ID = "ComposerAudit";

function model(s) {
	return {
		s,
		// ask/plan arrive from a running tool call, so the main turn is still streaming underneath the sheet.
		streaming: ["busy", "typing", "ask", "plan", "hot", "focus"].includes(s),
		compacting: s === "compact",
		conn: s === "offline" ? "connecting" : "ready",
		focus: s === "focus",
		ctx: s === "hot" ? 88 : 41,
	};
}

function topBar(m) {
	const busy = m.streaming || m.compacting;
	const label = { ready: "Connected", connecting: "Connecting" }[m.conn];
	const panel = m.s === "settings" || m.focus;
	return `<div class="sh-topbar">
		<button type="button" class="tb-back" aria-label="${panel ? "Back to Main" : "Back to sessions"}">←</button>
		<button type="button" class="tb-title-btn" title="Tap to rename session"><span class="tb-title">${TITLE}</span>${icon("pencil")}</button>
		<div class="tb-spacer"></div>
		<button type="button" class="tb-icon-btn tb-info-btn" title="Session info" aria-label="Toggle info panel">${icon("info")}</button>
		<div class="tb-conn-anchor"><button type="button" class="tb-conn-btn" aria-label="Connection: ${label}"><span class="tb-dot tb-dot-${m.conn}"></span><span class="tb-conn-label tb-conn-label--${m.conn}">${label}</span></button></div>
		<button type="button" class="tb-panel-btn tb-models-btn"${m.s === "settings" ? ' data-active="true"' : ""} aria-label="Toggle models panel" title="Models">${icon("sliders-horizontal")}</button>
		<button type="button" class="tb-panel-btn tb-agents-btn" aria-label="Toggle agent hub">${icon("bot")}${m.focus ? '<span class="tb-badge">1</span>' : ""}</button>
		<div class="tb-menu-anchor"><button type="button" class="tb-panel-btn tb-menu-btn" aria-label="Session actions"${busy ? " disabled" : ""}>${icon("ellipsis-vertical")}</button></div>
	</div>`;
}

const user = text => `<div class="tr-item"><div class="tr-row tr-row--user"><div class="tr-user-wrapper"><div class="tr-body"><div class="tr-md"><p>${text}</p>
</div></div><div class="tr-user-actions"><button type="button" class="tr-copy-btn tr-speak-btn" aria-label="Speak">${icon("volume-2")}</button><button type="button" class="tr-rewind-btn" disabled aria-label="Rewind to this message">${icon("rotate-ccw")}<span>Rewind</span></button></div></div></div></div>`;
const thinking = () => `<div class="tr-item"><div class="tr-thinking"><button type="button" class="tr-think-head" aria-expanded="false">${icon("chevron-right")}thinking</button></div></div>`;
const text = (html, actions = true) => `<div class="tr-item"><div class="tr-row tr-row--assistant"><div class="tr-body"><div class="tr-md"><p>${html}</p>
</div></div>${actions ? `<div class="tr-assistant-actions"><button type="button" class="tr-copy-btn tr-speak-btn" aria-label="Speak">${icon("volume-2")}</button></div>` : ""}</div></div>`;
// Running tools render the pending (spinner) status; production has no elapsed time on the card head.
const tool = (name, sum, status, last) => `<div class="tr-item"${last ? ' style="padding-bottom: 16px;"' : ""}><div class="tr-row tr-row--assistant"><div class="tr-body"><div class="tv-card"><button type="button" class="tv-head" aria-expanded="false"><span class="tv-status tv-status--${status}" aria-hidden="true"></span><span class="tv-name">${name}</span><span class="tv-sum"><span>${sum}</span></span><span class="tv-chev" aria-hidden="true"></span></button></div></div></div></div>`;

function transcript(m) {
	if (m.focus) {
		// Focused subagent transcript; App.tsx renders .fc-banner above it inside .sh-transcript.
		return `<div class="fc-banner" role="status">${icon("ghost")}<span class="fc-banner-id">${FOCUS_ID}</span><span class="fc-banner-hint">Esc returns to Main</span><button type="button" class="fc-banner-back">Main</button></div>
		<div class="tr-root"><div class="tr-list">
			${text("Reading <code>Composer.tsx</code> to map the busy-state controls.", false)}
			${tool("read", "Composer.tsx:380-440", "ok")}
			${text("The stop button shares a slot with send. Moving it out.", false)}
			${tool("edit", "composer.css", "pending", true)}
		</div></div>`;
	}
	// Production has no queued-message row, no steer-delivered marker and no compaction row while compacting.
	const running = m.streaming;
	return `<div class="tr-root"><div class="tr-list">
		${user("Retool the prototypes")}
		${thinking()}
		${text("Reading the three critiques, then rebuilding around one shared component set.", false)}
		${tool("read", "critique-CritiqueSystem.md", "ok")}
		${tool("bash", "bun test", running ? "pending" : "ok", true)}
	</div></div>`;
}

function statusStrip(m) {
	const lvl = p => (p >= 50 ? "danger" : p >= 25 ? "warning" : p >= 10 ? "notice" : "normal");
	const right = `<span class="ss-sep"></span><button type="button" class="ss-item ss-item--btn ss-tools" aria-label="Expand all tools">▶ tools</button><button type="button" class="ss-voice" aria-pressed="false" aria-label="Enable voice" title="Voice off">${icon("volume-x")}</button>`;
	if (m.focus) {
		// FocusStatusStrip: the model string is the agent's resolved model id, as the roster reports it.
		return `<div class="sh-status-strip"><div class="ss-strip ss-strip--focused"><div class="ss-group ss-group--left"><span class="ss-item ss-focus-id" title="Viewing agent ${FOCUS_ID}">${icon("ghost")}${FOCUS_ID}</span><span class="ss-sep"></span><span class="ss-item ss-model">anthropic/claude-opus-5-5:high</span><span class="ss-sep"></span><span class="ss-item ss-ctx ss-ctx--normal">7% / 1M</span></div><div class="ss-group ss-group--right"><span class="ss-item ss-cost">$0.86</span><span class="ss-sep"></span><span class="ss-item ss-indicator"><span class="ss-dot"></span>streaming</span>${right}</div></div></div>`;
	}
	const ind = m.streaming || m.compacting ? `<span class="ss-sep"></span><span class="ss-item ss-indicator"><span class="ss-dot"></span>${m.compacting ? "compacting" : "streaming"}</span>` : "";
	return `<div class="sh-status-strip"><div class="ss-strip"><div class="ss-group ss-group--left"><button type="button" class="ss-item ss-item--btn ss-model" title="Claude Opus 5.5">Claude Opus 5.5</button><span class="ss-sep"></span><button type="button" class="ss-item ss-item--btn ss-thinking">high</button><span class="ss-sep"></span><span class="ss-item ss-ctx ss-ctx--${lvl(m.ctx)}">${m.ctx}% / 1M</span><span class="ss-sep"></span><button type="button" class="ss-item ss-item--btn ss-plan ss-plan--off" aria-label="Plan mode: off"><span class="ss-plan-label">plan: off</span></button></div><div class="ss-group ss-group--right"><span class="ss-item ss-cost">$0.43</span>${ind}${right}</div></div></div>`;
}

function composer(m) {
	// Composer busy = streaming; a compaction alone leaves it in the idle Send layout.
	const busy = m.streaming;
	const typing = m.s === "typing";
	const mode = typing ? "followUp" : "steer";
	const ph = m.focus ? `Message ${FOCUS_ID}... (Esc returns to Main)` : busy ? "Steer or follow up..." : "Message the agent...";
	const value = typing ? "also check the keyboard-open case" : "";
	const label = busy ? (mode === "steer" ? "Steer" : "Queue") : "Send";
	const actions = busy ? `<div class="cmp-actions"><div class="cmp-segmented" role="radiogroup" aria-label="Send mode"><button type="button" role="radio" aria-checked="${mode === "steer"}" class="cmp-seg-btn${mode === "steer" ? " cmp-seg-active" : ""}">Steer</button><button type="button" role="radio" aria-checked="${mode === "followUp"}" class="cmp-seg-btn${mode === "followUp" ? " cmp-seg-active" : ""}">Queue</button></div><button type="button" class="cmp-btn-primary cmp-btn-stop">Stop</button></div>` : "";
	return `<div class="sh-composer"><div class="cmp-composer${m.focus ? " cmp-composer--focused" : ""}"><div class="cmp-input-row"><div class="cmp-history-nav" role="group" aria-label="Prompt history"><button type="button" class="cmp-history-btn" aria-label="Previous prompt">${icon("chevron-up")}</button><button type="button" class="cmp-history-btn" aria-label="Next prompt">${icon("chevron-down")}</button></div><textarea class="cmp-textarea" placeholder="${ph}" rows="1" style="height: 38px; overflow-y: hidden;">${value}</textarea><button type="button" class="cmp-attach" aria-label="Attach image"${m.focus ? " disabled" : ""}>+</button><button type="button" class="cmp-btn-primary"${value ? "" : " disabled"}>${label}</button></div>${actions}</div></div>`;
}

// ConnectionBanner: App maps reconnecting to "connecting" for the top bar; the banner keeps the store state.
const banner = m => (m.conn === "ready" ? "" : `<div class="conn-banner"><span class="conn-banner-text">Reconnecting to host...</span><button type="button" class="conn-banner-btn">Reconnect</button></div>`);

// AskDialog: two questions, first page, first option highlighted (no recommended index).
function ask() {
	const opt = (label, desc, hl) => `<button type="button" role="radio" aria-checked="false" class="xdlg-option xdlg-ask-option${hl ? " xdlg-ask-highlight" : ""}"><span class="xdlg-ask-option-row"><span class="xdlg-ask-mark xdlg-ask-radio"></span><span class="xdlg-option-label">${label}</span></span><span class="xdlg-option-desc">${desc}</span></button>`;
	return `<div class="plan-backdrop"></div><div class="plan-review-sheet xdlg-sheet" role="dialog" aria-label="Surface" data-method="ask"><div class="plan-review-header"><div class="plan-review-header-text"><h2 class="plan-review-title">Surface</h2><span class="plan-review-path">Q 1 of 2</span></div><button type="button" class="plan-review-close" aria-label="Cancel">${X_ICON}</button></div><div class="plan-review-body xdlg-body"><p class="xdlg-prompt">Which surface should the first redesign cover?</p><div class="xdlg-options" role="radiogroup">${opt("Top bar", "title and live line", true)}${opt("Composer", "steer, queue, stop", false)}</div><label class="xdlg-ask-other"><span class="xdlg-ask-other-label">Other</span><input type="text" class="plan-refine-input xdlg-input xdlg-ask-other-input" aria-label="Other" placeholder="Type your own answer"></label></div><div class="plan-review-footer"><button type="button" class="plan-btn plan-btn-primary">Next</button><button type="button" class="plan-btn plan-btn-cancel">Cancel</button></div></div>`;
}

// PlanReviewSheet as App mounts it: no onClose, so no close button and the backdrop does nothing.
function plan() {
	return `<div class="plan-backdrop"></div><div class="plan-review-sheet" role="dialog" aria-label="Rework the session screen"><div class="plan-review-header"><div class="plan-review-header-text"><h2 class="plan-review-title">Rework the session screen</h2><span class="plan-review-path">local://PLAN.md</span></div></div><div class="plan-review-body"><div class="tr-md"><h2>Rework the session screen</h2>
<p>6 steps, 4 files.</p>
<ol>
<li>Move the stop button out of the send slot in <code>Composer.tsx</code>.</li>
<li>Replace the Steer/Queue segmented control with a mode chip.</li>
<li>Add a live activity line under the title in <code>TopBar.tsx</code>.</li>
<li>Fold the status strip into the top bar sheet.</li>
<li>Restyle <code>composer.css</code> and <code>shell.css</code> for the new layout.</li>
<li>Update the webgui tests.</li>
</ol>
</div></div><div class="plan-review-footer"><button type="button" class="plan-btn plan-btn-primary">Approve and execute</button><button type="button" class="plan-btn plan-btn-secondary">Approve and compact</button><button type="button" class="plan-btn plan-btn-secondary plan-btn-refine">Refine</button></div></div>`;
}

const keyboard = () => {
	const r = n => `<div>${"<i></i>".repeat(n)}</div>`;
	return `<div class="kbd"><div class="acc"><span>⌃⌄</span>Done</div><div class="keys">${r(10)}${r(9)}${r(9)}<div class="wide"><i></i></div></div></div>`;
};

function render(s) {
	if (!STATES.includes(s)) s = "busy";
	const m = model(s);
	const overlay = s === "ask" ? ask() : s === "plan" ? plan() : s === "settings" ? PANEL : "";
	document.getElementById("phone").innerHTML = `<div class="sb"><span>15:32</span><span>5G ▮</span></div>
		<div class="ph-app"><div id="root"><div class="sh-app">
			${topBar(m)}
			<div class="sh-main"><div class="sh-transcript">${banner(m)}${transcript(m)}</div>${statusStrip(m)}</div>
			${composer(m)}
		</div>${overlay}<div class="toast-container"></div></div></div>
		${s === "typing" ? keyboard() : ""}`;
	// Composer.autoGrow: 22px lines, MAX_ROWS 8.
	const ta = document.querySelector(".cmp-textarea");
	ta.style.height = "auto";
	ta.style.height = `${Math.min(ta.scrollHeight, 22 * 8)}px`;
	if (s === "typing") {
		ta.focus({ preventScroll: true });
		ta.setSelectionRange(ta.value.length, ta.value.length);
	}
}
render(new URLSearchParams(location.search).get("state") ?? "busy");
</script>
</body>
</html>
